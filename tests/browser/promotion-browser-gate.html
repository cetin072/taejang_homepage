<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>promotion browser gate</title>
</head>
<body>
  <a class="staff-brand" href="#">태장</a>
  <a class="app-logo" href="#">태장 업무플랫폼</a>
  <button id="logout-button" type="button">logout</button>
  <section id="desktop-app-shell" hidden>
    <nav id="app-nav"></nav>
    <div class="app-workspace">
      <header>
        <button id="sidebar-toggle" type="button" aria-expanded="false">menu</button>
        <h1 id="desktop-page-title">업무 대시보드</h1>
        <span id="desktop-role-label"></span>
        <div class="app-user-actions"><span id="desktop-user-label"></span><button id="desktop-logout-button" type="button">logout</button></div>
      </header>
      <main id="dashboard-main"></main>
    </div>
  </section>
  <pre id="result">RUNNING</pre>

  <script>
    let currentRoute = 'promotion_staff';
    let openedPromotionMode = null;
    let homepageManagementOpened = false;
    let failInformationSave = false;
    const fakeMetadata = {
      url: 'https://www.youtube.com/watch?v=taejang-test',
      title: '태장 공식 영상',
      channel_url: 'https://www.youtube.com/@taejangofficial'
    };
    const now = Date.now();
    const publicationItems = [
      {
        content_id: '11111111-1111-4111-8111-111111111111',
        title: '최근 공개글',
        content_type: 'homepage_article',
        lifecycle: 'published',
        published_at: new Date(now - 60 * 60 * 1000).toISOString()
      },
      {
        content_id: '22222222-2222-4222-8222-222222222222',
        title: '24시간 지난 공개글',
        content_type: 'homepage_article',
        lifecycle: 'published',
        published_at: new Date(now - 48 * 60 * 60 * 1000).toISOString()
      }
    ];
    const informationRequests = [{
      id: '33333333-3333-4333-8333-333333333333',
      information_kind: 'notice',
      category_code: 'general',
      importance_code: 'important',
      title: '운영팀장 상신 공지',
      body_easy: '검수용 공지 본문',
      reason: '브라우저 검수',
      status: 'pending',
      requested_by_name: '운영팀장'
    }];

    window.alert = () => {};
    window.confirm = () => true;
    window.prompt = () => '브라우저 검수 사유';
    window.fetch = async () => new Response(JSON.stringify(fakeMetadata), {
      status: 200,
      headers: { 'Content-Type': 'application/json' }
    });

    window.TaejangFeatureHealth = { hasFailed: () => false, showFailure() {} };
    window.TaejangSupportRadarAccess = { canManagementView: () => false };
    window.TaejangPromotionWorkspaceV2Api = {
      openPromotion(mode) { openedPromotionMode = mode; },
      openHomepageManagement() { homepageManagementOpened = true; }
    };
    window.TaejangApp = {
      getRoute: () => currentRoute,
      getContext: () => ({ display_name: '브라우저검수', roles: [{ code: currentRoute }] }),
      getEffectiveRoles: () => [currentRoute],
      can: capability => capability === 'promotion.review_lead' || capability === 'promotion.write' || capability === 'promotion.edit_own',
      hasCapabilityContract: () => true,
      friendlyError: error => error?.message || '오류',
      rpc: async (name, args = {}) => {
        if (name === 'get_my_schedule_list') return [];
        if (name === 'get_my_notice_list') return [{ title: '중요 공지', importance: 'important', body_easy: '오늘 확인할 공지' }];
        if (name === 'get_my_promotion_workspace') {
          if (currentRoute === 'promotion_staff') {
            return {
              role: currentRoute,
              my_items: [
                { content_id: 'returned-1', title: '보완 글', lifecycle: 'needs_revision' },
                { content_id: 'sent-1', title: '보낸 글 예시', lifecycle: 'review_pending', submitted_at: new Date(now - 1000).toISOString() }
              ],
              review_items: []
            };
          }
          if (currentRoute === 'promotion_lead') {
            return { role: currentRoute, my_items: [], review_items: [{ content_id: 'lead-1', title: '상신 후 반송', required_stage: 'operations' }] };
          }
          return { role: currentRoute, my_items: [], review_items: [] };
        }
        if (name === 'get_promotion_review_handoff' && args.p_content_id === 'lead-1') {
          return { source: 'operations_changes_requested', comment: '운영총괄 보완 의견' };
        }
        if (name === 'get_promotion_review_submitter') {
          return { owner_name: '홍보직원', submitted_by_name: '홍보직원' };
        }
        if (name === 'get_promotion_link_source') return 'none';
        if (name === 'get_promotion_publication_admin') return { items: publicationItems };
        if (name === 'list_public_content_change_requests') return [];
        if (name === 'list_information_publication_requests') return informationRequests;
        if (name === 'save_information_publication_request') {
          if (failInformationSave) throw new Error('의도된 저장 실패');
          return { ok: true, request_id: informationRequests[0].id, status: 'pending' };
        }
        if (name === 'review_information_publication_request') return { ok: true, status: args.p_action === 'approve' ? 'approved' : args.p_action };
        return null;
      }
    };

    document.addEventListener('taejang-open-promotion-workspace', event => {
      openedPromotionMode = event.detail?.mode || null;
    });
  </script>
  <script src="../../app/assets/official-channel-config.js"></script>
  <script src="../../app/assets/dashboard-shell.js"></script>
  <script src="../../app/assets/issue-181-promotion-live-ux.js"></script>
  <script src="../../app/assets/phase-c-publication-admin.js"></script>
  <script src="../../app/assets/ux-followup-polish.js"></script>
  <script src="../../app/assets/issue-207-promotion-information-ux.js"></script>
  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const labels = () => [...document.querySelectorAll('#app-nav > button')].map(node => node.textContent.trim());
    const fieldByLabel = label => [...document.querySelectorAll('.phase-c-board-form label')]
      .find(node => node.querySelector('span')?.textContent.trim() === label)?.querySelector('input, textarea, select');
    const buttonByText = (root, value) => [...root.querySelectorAll('button')].find(node => node.textContent.trim() === value);

    window.addEventListener('load', async () => {
      const output = document.getElementById('result');
      try {
        document.dispatchEvent(new CustomEvent('taejang-app-ready', { detail: { route: 'promotion_staff', label: '홍보직원' } }));
        await wait(320);

        const staffLabels = labels();
        assert(staffLabels.includes('새 홍보글 작성'), 'Issue 207 새 홍보글 작성 메뉴 누락');
        assert(staffLabels.includes('보낸 글'), 'Issue 207 보낸 글 메뉴 누락');
        assert(staffLabels.includes('보완 요청받은 글'), 'Issue 207 보완 요청받은 글 메뉴 누락');
        assert(staffLabels.includes('공지 확인'), 'Issue 207 공지 확인 메뉴 누락');
        assert(!staffLabels.some(label => label.includes('안내')), '공지 메뉴에 안내 용어가 남아 있음');
        assert(!staffLabels.includes('수정·보완 요청'), '구형 반환 메뉴명이 남아 있음');
        assert(document.querySelectorAll('[data-phase-c-v2-nav="revision"]').length === 1, '반환 글 메뉴가 중복 생성됨');

        const returned = document.querySelector('[data-promotion-returned-nav]');
        assert(returned, '반환 글 메뉴 식별자 누락');
        returned.click();
        assert(openedPromotionMode === 'revision', '반환 글 메뉴가 revision 화면을 열지 않음');

        const returnedCard = [...document.querySelectorAll('.dashboard-card')]
          .find(card => card.querySelector('h3')?.textContent.trim() === '보완 요청받은 글');
        assert(returnedCard, '대시보드 반환 글 카드 누락');
        assert(returnedCard.textContent.includes('1건'), '반환 글 건수 누락');

        document.querySelector('[data-issue207-nav="sent"]').click();
        await wait(30);
        assert(document.getElementById('desktop-page-title').textContent === '보낸 글', '보낸 글 화면이 작성 화면과 분리되지 않음');
        assert(document.getElementById('dashboard-main').textContent.includes('보낸 글 예시'), '보낸 글 목록을 표시하지 못함');

        await window.TaejangIssue207Ux.openInformationRead();
        assert(document.getElementById('dashboard-main').textContent.includes('오늘 확인할 공지'), '직원 공지 확인 화면 누락');
        assert(!document.getElementById('dashboard-main').textContent.includes('상시 안내'), '공지 확인 화면에 안내 영역이 남아 있음');

        assert(window.TaejangOfficialChannels.classifyUrl('https://blog.naver.com/taejang-official/223000000000') === 'taejang_blog', '공식 블로그 개별 글 분류 실패');
        assert(window.TaejangOfficialChannels.classifyUrl('https://m.blog.naver.com/PostView.naver?blogId=taejang-official&logNo=223000000000') === 'taejang_blog', '모바일 공식 블로그 글 분류 실패');

        const metadataObserved = new Promise(resolve => document.addEventListener('taejang-external-meta-observed', resolve, { once: true }));
        await window.fetch('/.netlify/functions/external-content-meta', {
          method: 'POST',
          body: JSON.stringify({ url: 'https://www.youtube.com/watch?v=taejang-test' })
        });
        await metadataObserved;
        assert(window.TaejangOfficialChannels.classifyUrl('https://www.youtube.com/watch?v=taejang-test') === 'taejang_youtube', '공식 유튜브 개별 영상 메타데이터 분류 실패');

        currentRoute = 'promotion_lead';
        const nav = document.getElementById('app-nav');
        nav.replaceChildren();
        ['대시보드', '홍보 작성', '홍보 검토'].forEach(label => {
          const node = document.createElement('button'); node.type = 'button'; node.textContent = label; nav.append(node);
        });
        window.TaejangIssue207Ux.ensureNavigation();
        const leadLabels = labels();
        assert(leadLabels.includes('새 홍보글 작성'), '운영팀장 새 홍보글 메뉴 누락');
        assert(leadLabels.includes('승인·검토'), '운영팀장 승인·검토 메뉴 누락');
        assert(leadLabels.includes('기존 글 관리'), '운영팀장 기존 글 관리 메뉴 자동 복구 실패');
        assert(leadLabels.includes('홈페이지 내용 관리'), '운영팀장 홈페이지 내용 관리 메뉴 자동 복구 실패');
        assert(leadLabels.includes('공지 관리'), '운영팀장 공지 관리 메뉴 누락');
        assert(!leadLabels.some(label => label.includes('안내')), '운영팀장 메뉴에 안내 용어가 남아 있음');

        document.querySelector('[data-phase-c-v2-nav="homepage"]').click();
        assert(homepageManagementOpened, '홈페이지 내용 관리 복구 메뉴가 기존 관리 기능을 열지 않음');

        await window.TaejangPublicationAdmin.openPublicationAdmin();
        const adminMain = document.getElementById('dashboard-main');
        assert(!adminMain.querySelector('iframe'), '기존 글 관리에서 숨은 archive iframe이 생성됨');
        const recentCard = [...adminMain.querySelectorAll('.dashboard-card')].find(card => card.textContent.includes('최근 공개글'));
        const oldCard = [...adminMain.querySelectorAll('.dashboard-card')].find(card => card.textContent.includes('24시간 지난 공개글'));
        assert(recentCard && recentCard.textContent.includes('24시간 내 삭제'), '24시간 이내 공개글 직접 정리 경로 누락');
        assert(oldCard && oldCard.textContent.includes('수정 요청'), '24시간 경과 공개글 수정 요청 경로 누락');
        assert(oldCard.textContent.includes('24시간 경과 · 삭제 불가'), '24시간 경과 공개글 삭제 차단 안내 누락');

        await window.TaejangIssue207Ux.openInformationHub();
        assert(document.getElementById('desktop-page-title').textContent === '공지 관리', '운영팀장 공지 관리 제목 불일치');
        assert(document.getElementById('dashboard-main').textContent.includes('새 공지 작성'), '운영팀장 공지 작성 화면 누락');
        assert(!document.getElementById('dashboard-main').textContent.includes('상시 안내'), '운영팀장 공지 화면에 안내 유형이 남아 있음');
        const titleInput = fieldByLabel('제목');
        const bodyInput = fieldByLabel('내용');
        const reasonInput = fieldByLabel('상신 사유');
        titleInput.value = '저장 실패 보존 제목';
        bodyInput.value = '저장 실패 보존 본문';
        reasonInput.value = '저장 실패 보존 사유';
        failInformationSave = true;
        buttonByText(document.getElementById('dashboard-main'), '운영총괄에게 상신').click();
        await wait(40);
        assert(titleInput.value === '저장 실패 보존 제목', '공지 저장 실패 후 제목이 유실됨');
        assert(bodyInput.value === '저장 실패 보존 본문', '공지 저장 실패 후 본문이 유실됨');
        assert(reasonInput.value === '저장 실패 보존 사유', '공지 저장 실패 후 상신 사유가 유실됨');
        failInformationSave = false;

        currentRoute = 'operations_manager';
        await window.TaejangIssue207Ux.openInformationHub();
        const opsMain = document.getElementById('dashboard-main');
        assert(opsMain.textContent.includes('승인·검토 목록'), '운영총괄 공지 검토 목록 누락');
        assert(buttonByText(opsMain, '승인·게시'), '운영총괄 승인·게시 버튼 누락');
        assert(buttonByText(opsMain, '보완 요청'), '운영총괄 보완 요청 버튼 누락');
        assert(buttonByText(opsMain, '반려'), '운영총괄 반려 버튼 누락');
        assert(!opsMain.textContent.includes('상시 안내'), '운영총괄 공지 화면에 안내 유형이 남아 있음');

        currentRoute = 'promotion_lead';
        document.getElementById('desktop-page-title').textContent = '홍보 검토';
        const main = document.getElementById('dashboard-main');
        main.innerHTML = '<header class="dashboard-intro"><h2>홍보 검토</h2><p>검토</p></header><section class="phase-c-v2-grid"><article class="phase-c-v2-card"><h3>상신 후 반송</h3><div class="quick-links"><button type="button">직접 수정</button></div></article></section>';
        window.TaejangIssue181PromotionLiveUx.sync();
        await wait(120);
        assert(!main.querySelector('[data-issue181-review-delete]'), '운영총괄 반송 글에 삭제 버튼이 노출됨');

        const preview = document.createElement('section');
        preview.className = 'promotion-preview-panel';
        preview.scrollIntoView = () => { preview.dataset.scrolled = '1'; };
        const previewButton = document.createElement('button');
        previewButton.type = 'button';
        previewButton.textContent = '미리보기';
        main.append(preview, previewButton);
        previewButton.click();
        await wait(30);
        assert(preview.dataset.scrolled === '1', '미리보기 결과가 사용자 위치로 이동하지 않음');

        output.textContent = 'PROMOTION_BROWSER_GATE_PASS';
        document.title = 'PROMOTION_BROWSER_GATE_PASS';
      } catch (error) {
        output.textContent = `PROMOTION_BROWSER_GATE_FAIL: ${error.message}`;
        document.title = 'PROMOTION_BROWSER_GATE_FAIL';
      }
    });
  </script>
</body>
</html>
