<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>promotion v2 publication gate</title>
</head>
<body>
  <section id="desktop-app-shell">
    <button id="sidebar-toggle" type="button" aria-expanded="false">menu</button>
    <nav id="app-nav"></nav>
    <h1 id="desktop-page-title">홍보 검토</h1>
    <main id="dashboard-main"></main>
  </section>
  <pre id="result">RUNNING</pre>

  <script>
    const state = {
      promptResponses: [],
      queueCalls: [],
      publication: {
        content_id: '11111111-1111-4111-8111-111111111111',
        title: '발행 검수 글',
        content_type: 'homepage_article',
        lifecycle: 'approved',
        queue_status: null,
        scheduled_for: null
      }
    };

    window.alert = () => {};
    window.confirm = () => true;
    window.prompt = () => state.promptResponses.shift() ?? '';
    window.TaejangApp = {
      getRoute: () => 'promotion_lead',
      hasCapabilityContract: () => true,
      can: capability => ['promotion.review_lead', 'promotion.queue_publication'].includes(capability),
      friendlyError: error => error?.message || '오류',
      rpc: async (name, body = {}) => {
        if (name === 'get_my_promotion_workspace') {
          return {
            role: 'promotion_lead',
            review_items: [],
            my_items: [],
            publication_items: [{ ...state.publication }]
          };
        }
        if (name === 'queue_promotion_revision') {
          state.queueCalls.push({ ...body });
          state.publication.queue_status = 'queued';
          state.publication.scheduled_for = body.p_scheduled_for || null;
          if (body.p_scheduled_for) state.publication.lifecycle = 'scheduled';
          return { ok: true, code: 'QUEUED' };
        }
        return null;
      }
    };
  </script>
  <script src="../../app/assets/phase-c-workspace-v2.js"></script>
  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const buttonByText = value => [...document.querySelectorAll('#dashboard-main button')]
      .find(button => button.textContent.trim() === value);

    window.addEventListener('load', async () => {
      const output = document.getElementById('result');
      try {
        await window.TaejangPromotionWorkspaceV2Api.openPromotion('review');

        let queueButton = buttonByText('발행 대기함에 넣기');
        assert(queueButton, 'V2 발행 대기 버튼 누락');
        assert([...document.querySelectorAll('#dashboard-main a')]
          .some(link => link.textContent.trim() === '공개 결과 경로 확인'), '공개 결과 경로 링크 누락');

        state.promptResponses.push('');
        queueButton.click();
        await wait(80);

        assert(state.queueCalls.length === 1, '빈 예약일 발행 RPC 호출 횟수 오류');
        assert(state.queueCalls[0].p_content_id === state.publication.content_id, '발행 RPC content_id 불일치');
        assert(state.queueCalls[0].p_scheduled_for === null, '빈 예약일은 null이어야 함');
        assert(!buttonByText('발행 대기함에 넣기'), 'queued 상태에서 중복 발행 버튼이 남아 있음');
        assert(document.getElementById('dashboard-main').textContent.includes('발행 대기함 등록 완료'), 'queued 완료 상태 표시 누락');

        state.publication.queue_status = null;
        state.publication.lifecycle = 'approved';
        state.publication.scheduled_for = null;
        await window.TaejangPromotionWorkspaceV2Api.openPromotion('review');

        state.promptResponses.push('2026-10-01');
        queueButton = buttonByText('발행 대기함에 넣기');
        assert(queueButton, '예약 발행 버튼 재렌더링 실패');
        queueButton.click();
        await wait(80);

        assert(state.queueCalls.length === 2, '예약 발행 RPC 호출 횟수 오류');
        assert(state.queueCalls[1].p_scheduled_for === '2026-10-01T00:00:00+09:00', '예약일 KST 변환 오류');
        assert(!buttonByText('발행 대기함에 넣기'), 'scheduled 상태에서 중복 발행 버튼이 남아 있음');
        assert(document.getElementById('dashboard-main').textContent.includes('예약: 2026-10-01T00:00:00+09:00'), '예약 완료 상태 표시 누락');
        assert([...document.querySelectorAll('#dashboard-main a')]
          .some(link => link.textContent.trim() === '공개 결과 경로 확인'), '예약 후 공개 결과 경로 링크 누락');

        output.textContent = 'PROMOTION_V2_PUBLICATION_GATE_PASS';
      } catch (error) {
        output.textContent = `PROMOTION_V2_PUBLICATION_GATE_FAIL:${error.message}`;
      }
    });
  </script>
</body>
</html>
