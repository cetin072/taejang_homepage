<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>직원관리 합성 QA</title>
<link rel="stylesheet" href="../../staff/assets/staff.css">
<link rel="stylesheet" href="../../app/assets/dashboard-shell.css">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 'Malgun Gothic',sans-serif;background:#f4f6f4;color:#21382d}
.desktop-app-shell{width:100%;margin:0;border-radius:0;box-shadow:none}.app-workspace{min-width:0}
#dashboard-main{width:min(100% - 32px,1180px);padding:24px 0}.app-topbar{min-height:65px}
[hidden]{display:none!important}.quick-links{display:flex;flex-wrap:wrap;gap:10px}
</style></head><body class="desktop-app-mode">
<div id="desktop-app-shell" class="desktop-app-shell"><aside class="app-sidebar"><p>태장 · 합성 QA</p></aside><div class="app-workspace">
<header class="app-topbar"><button id="sidebar-toggle">메뉴</button><h1 id="desktop-page-title">직원 관리</h1></header>
<main id="dashboard-main" class="dashboard-main"></main></div></div>
<script>
window.fixtureRoute='operations_manager'; window.calls=[]; window.fail=''; window.alerts=[]; window.alert=message=>alerts.push(message);
sessionStorage.setItem('taejang-staff-session-v1',JSON.stringify({access_token:'synthetic-only'}));
const employees=Array.from({length:50},(_,i)=>({id:'fixture-'+i,employee_id:'TJ-'+String(i+1).padStart(6,'0'),full_name:i===49?'가상 매우 긴 이름을 가진 직원 테스트':'가상직원 '+String(i+1).padStart(2,'0'),department_id:'dept',department_name:i===49?'가상 매우 긴 부서 이름과 조직명 표시 검수 부서':'포장팀',position_id:'position',position_name:'사원',hired_on:'2026-01-02',departed_on:i===48?'2026-09-01':null,employment_status:i===48?'departed':i===47?'leave':'active',attendance_required:i%3!==0,linked_profile:i%2?null:{id:'profile-'+i,display_name:'가상 앱직원',work_email:'synthetic@example.test',account_status:i===4?'suspended':i===6?'pending':'active'},profile_photo_path:i===2?'fixture-2/profile/existing.png':null,resident_number_registered:true,birth_date:'2000-01-01',age_years:26}));
employees[1].full_name=employees[0].full_name;
window.fixtureContext={access_level:'operations_manager',can_manage_sensitive_identity:true,employees,departments:[{id:'dept',name:'포장팀'}],positions:[{id:'position',name:'사원'}],new_employee_positions:[{id:'position',name:'사원'}],change_requests:[],self_service_contact_requests:[]};
window.objects=new Map();
const realFetch=window.fetch.bind(window);
window.fetch=async(url,options={})=>{
  if(url==='/.netlify/functions/staff-config')return new Response(JSON.stringify({url:'https://fixture.invalid',publishableKey:'synthetic-key'}));
  if(String(url).startsWith('https://fixture.invalid/storage/v1/object/')){
    calls.push({name:'storage',url,method:options.method});
    if(fail==='storage')return new Response(JSON.stringify({message:'합성 Storage 실패'}),{status:500});
    if(String(url).includes('/object/sign/'))return new Response(JSON.stringify({signedURL:'/object/sign/employee-private-media/fixture.png?token=synthetic'}));
    objects.set(String(url).split('/employee-private-media/')[1],options.body);
    return new Response('{}');
  }
  return realFetch(url,options);
};
window.TaejangApp={getRoute:()=>fixtureRoute,hasCapabilityContract:()=>true,can:()=>fixtureRoute==='operations_manager',friendlyError:error=>error.message,rpc:async(name,args)=>{
  calls.push({name,args});
  if(name==='get_employee_management_context'){
    if(fail==='context'||fail==='refresh'){if(fail==='refresh')window.fail='';throw Error('합성 context 실패');}
    return structuredClone(fixtureContext);
  }
  if(name==='get_target_audit_trail')return {items:[]};
  if(fail==='db')throw Error('합성 DB 실패');
  if(name==='update_employee_core'){
    const e=employees.find(e=>e.id===args.p_employee_uuid);e.full_name=args.p_full_name;e.attendance_required=args.p_attendance_required;
  }else if(name==='set_employee_photo'){
    if(fail!=='mismatch')employees.find(e=>e.id===args.p_employee_uuid)[args.p_photo_type==='profile'?'profile_photo_path':'id_photo_path']=args.p_storage_path;
  }else if(name==='submit_employee_change_request'){
    fixtureContext.change_requests.push({id:'request-'+calls.length,employee_uuid:args.p_employee_uuid,request_type:args.p_request_type,requested_changes:args.p_requested_changes,status:'pending'});
  }else if(name!=='create_employee')throw Error('Unexpected fixture RPC '+name);
  if(fail==='afterwrite')window.fail='refresh';
  return {ok:true};
}};
</script>
<script src="../../app/assets/employee-management-views.js"></script>
<script src="../../app/assets/employee-management.js"></script>
<script src="../../app/assets/operations-delete-controls.js"></script>
</body></html>
