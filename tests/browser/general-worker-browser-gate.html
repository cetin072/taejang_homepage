<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>general worker browser gate</title>
</head>
<body>
  <div class="staff-shell">
    <header class="staff-header"><a class="staff-brand" href="#">태장</a></header>
    <section id="general-worker-board">legacy worker board</section>
  </div>
  <pre id="result">RUNNING</pre>

  <script>
    const state = {
      clockIn: null,
      acknowledged: false,
      recordCalls: 0,
      ackCalls: 0
    };

    window.alert = () => {};
    window.TaejangPwaInstall = { makeInstallCard: () => null };
    window.TaejangAttendanceLocation = {
      async getBestPosition() {
        return { coords: { latitude: 35.18, longitude: 128.68, accuracy: 8 } };
      }
    };
    window.TaejangApp = {
      getRoute: () => 'general_worker',
      getContext: () => ({
        display_name: '일반직원 QA',
        role_simulation: { can_switch: true, active: false, role_code: null }
      }),
      friendlyError: error => error?.message || '오류',
      rpc: async (name) => {
        if (name === 'get_my_attendance_today') {
          return {
            attendance_required: true,
            is_workday: true,
            clock_in: state.clockIn,
            clock_out: null
          };
        }
        if (name === 'record_attendance_event') {
          state.recordCalls += 1;
          state.clockIn = {
            status: 'recorded',
            event_at: '2026-09-15T00:00:00Z'
          };
          return { ok: true, code: 'RECORDED' };
        }
        if (name === 'get_my_notice_list') {
          return [{
            id: '11111111-1111-4111-8111-111111111111',
            version_no: 1,
            title: '일반직원 필수 공지',
            summary: '오늘 작업 전 확인하세요.',
            importance: 'important',
            requires_acknowledgement: true,
            acknowledged: state.acknowledged
          }];
        }
        if (name === 'acknowledge_notice') {
          state.ackCalls += 1;
          state.acknowledged = true;
          return { ok: true, code: 'ACKNOWLEDGED' };
        }
        if (name === 'request_attendance_exception') {
          return { ok: true, code: 'EXCEPTION_PENDING' };
        }
        return null;
      }
    };
  </script>
  <script src="../../app/assets/employee-common-home-v1.js"></script>
  <script src="../../app/assets/role-screen-polish.js"></script>
  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const buttonByText = value => [...document.querySelectorAll('button')]
      .find(button => !button.hidden && button.textContent.trim() === value);

    window.addEventListener('load', async () => {
      const output = document.getElementById('result');
      try {
        document.dispatchEvent(new CustomEvent('taejang-app-ready', {
          detail: { route: 'general_worker', label: '일반직원' }
        }));
        await wait(260);

        const home = document.getElementById('employee-common-home');
        assert(home, '공통 일반직원 홈이 생성되지 않음');
        assert(document.body.classList.contains('employee-home-mode'), '공통 직원 홈 화면 모드 누락');
        assert(!document.body.classList.contains('general-worker-mode'), '구형 일반직원 화면 모드가 다시 활성화됨');
        assert(document.getElementById('general-worker-board').hidden === true, '구형 일반직원 보드가 숨겨지지 않음');
        assert(document.getElementById('general-worker-board').classList.contains('worker-v1-hidden'), '구형 일반직원 보드 복구 가드 누락');
        assert(home.hidden === false, '공통 일반직원 홈이 숨김 상태임');
        assert(!document.getElementById('worker-mobile-home'), '삭제된 worker-mobile 홈이 다시 생성됨');
        assert(home.textContent.includes('일반직원 QA님, 안녕하세요'), '일반직원 인사말 누락');
        assert(home.textContent.includes('오늘 출퇴근'), '출퇴근 카드 누락');
        assert(home.textContent.includes('꼭 확인하세요'), '공지 카드 누락');
        assert(home.textContent.includes('일반직원 필수 공지'), '공지 내용 렌더링 실패');
        assert(home.textContent.includes('중요공지'), '중요 공지 표시 누락');

        const homeStyle = getComputedStyle(home);
        const card = home.querySelector('.employee-card');
        const cardStyle = getComputedStyle(card);
        assert(homeStyle.display === 'grid', `일반직원 홈 레이아웃 CSS 미적용: ${homeStyle.display}`);
        assert(parseFloat(cardStyle.borderRadius) >= 16, `일반직원 카드 디자인 미적용: ${cardStyle.borderRadius}`);
        assert(cardStyle.backgroundColor !== 'rgba(0, 0, 0, 0)', '일반직원 카드 배경 CSS 미적용');

        const simulationCard = home.querySelector('[data-employee-simulation-card]');
        assert(simulationCard, '일반직원 역할 체험 카드 누락');
        const simulationStyle = getComputedStyle(simulationCard);
        assert(parseFloat(simulationStyle.borderRadius) >= 16, `역할 체험 카드 디자인 미적용: ${simulationStyle.borderRadius}`);
        const roleButton = [...simulationCard.querySelectorAll('button')].find(button => button.textContent.trim() === '일반직원');
        assert(roleButton, '일반직원 역할 체험 버튼 누락');
        assert(parseFloat(getComputedStyle(roleButton).borderRadius) >= 10, '역할 체험 버튼이 브라우저 기본 디자인으로 노출됨');

        const clockIn = buttonByText('출근했습니다');
        assert(clockIn, '출근 버튼 누락');
        clockIn.click();
        await wait(80);
        assert(state.recordCalls === 1, '출근 RPC가 정확히 한 번 호출되지 않음');
        assert(home.textContent.includes('출근 완료'), '출근 성공 후 화면 갱신 실패');
        assert(buttonByText('퇴근했습니다'), '출근 완료 후 퇴근 버튼으로 전환되지 않음');

        const ack = buttonByText('확인했습니다');
        assert(ack, '필수 공지 확인 버튼 누락');
        ack.click();
        await wait(80);
        assert(state.ackCalls === 1, '공지 확인 RPC가 정확히 한 번 호출되지 않음');
        assert(home.textContent.includes('✓ 확인했습니다'), '공지 확인 후 완료 표시 누락');
        assert(!buttonByText('확인했습니다'), '공지 확인 후 중복 확인 버튼이 남아 있음');

        output.textContent = 'GENERAL_WORKER_BROWSER_GATE_PASS';
      } catch (error) {
        output.textContent = `GENERAL_WORKER_BROWSER_GATE_FAIL:${error.message}`;
      }
    });
  </script>
</body>
</html>
