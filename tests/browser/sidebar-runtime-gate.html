<body class="desktop-app-mode">
  <section id="desktop-app-shell" class="desktop-app-shell">
    <aside id="app-sidebar" class="app-sidebar">
      <nav id="app-nav" class="app-nav"></nav>
    </aside>
    <div class="app-workspace">
      <header class="app-topbar">
        <button id="sidebar-toggle" type="button" aria-expanded="false">menu</button>
        <h1 id="desktop-page-title">업무 대시보드</h1>
        <span id="desktop-role-label"></span>
        <div class="app-user-actions"><span id="desktop-user-label"></span><button id="desktop-logout-button" type="button">logout</button></div>
      </header>
      <main id="dashboard-main"></main>
      <section id="today-admin-panel" hidden><h2>업무 배정</h2></section>
      <section id="schedule-admin-panel" hidden><h2>일정 관리</h2></section>
      <section id="notice-admin-panel" hidden><h2>공지 관리</h2></section>
      <section id="guidance-admin-panel" hidden><h2>상시 안내 관리</h2></section>
    </div>
  </section>
  <button id="logout-button" type="button">logout</button>
  <pre id="result">RUNNING</pre>

  <script>
    let currentRoute = 'promotion_staff';
    const roleCapabilities = {
      promotion_staff: new Set(['promotion.write', 'promotion.edit_own']),
      promotion_lead: new Set([
        'employee.view_scoped', 'employee.request_change',
        'promotion.write', 'promotion.review_lead', 'promotion.edit_own', 'promotion.archive', 'promotion.restore',
        'promotion.manage_recent_public', 'promotion.request_public_change', 'promotion.queue_publication', 'information.submit',
        'attendance.admin_view', 'homepage.draft', 'homepage.review', 'support_radar.assigned_work'
      ]),
      operations_manager: new Set([
        'employee.view_all', 'employee.create', 'employee.onboard', 'account.approve', 'account.reject',
        'promotion.write', 'promotion.review_lead', 'promotion.review_operations', 'promotion.edit_own', 'promotion.edit_any_unpublished',
        'promotion.archive', 'promotion.restore', 'promotion.hide', 'promotion.republish', 'promotion.manage_recent_public',
        'promotion.request_public_change', 'promotion.queue_publication', 'information.review',
        'attendance.admin_view', 'attendance.exception_review', 'attendance.correct', 'audit.target_history.read',
        'homepage.draft', 'homepage.review', 'homepage.approve_apply', 'homepage.direct_edit',
        'task.manage', 'notice.manage', 'payroll.manage', 'payroll.handoff.approve',
        'support_radar.management_view', 'support_radar.management_edit', 'support_radar.assigned_work',
        'platform.navigation.manage'
      ])
    };

    window.alert = () => {};
    window.confirm = () => true;
    window.prompt = () => '테스트';
    window.TaejangFeatureHealth = { hasFailed: () => false, showFailure() {} };
    window.TaejangOfficialChannels = { list: [] };
    window.TaejangIssue181PromotionLiveUx = {};
    window.TaejangSupportRadarLifecycle = { emit() {} };
    window.TaejangSupportRadarAccess = {
      canAssignedWork: () => ['promotion_lead', 'operations_manager'].includes(currentRoute),
      canManagementView: () => currentRoute === 'operations_manager',
      canManagementEdit: () => currentRoute === 'operations_manager'
    };
    window.TaejangApp = {
      getRoute: () => currentRoute,
      getContext: () => ({ display_name: '사이드바 QA', roles: [{ code: currentRoute }] }),
      getEffectiveRoles: () => [currentRoute],
      hasCapabilityContract: () => true,
      can: capability => roleCapabilities[currentRoute]?.has(capability) || false,
      friendlyError: error => error?.message || '오류',
      rpc: async (name, body = {}) => {
        if (name === 'get_my_ui_preferences') return {
          role_code: currentRoute, collapsed_sections: [], sidebar_section_order: [], sidebar_menu_order: [], dashboard_order: []
        };
        if (name === 'get_my_navigation_visibility') return { hidden_menu_keys: [] };
        if (name === 'save_my_ui_preferences') return {
          role_code: currentRoute,
          collapsed_sections: [],
          sidebar_section_order: body.p_sidebar_section_order || [],
          sidebar_menu_order: body.p_sidebar_menu_order || [],
          dashboard_order: body.p_dashboard_order || []
        };
        if (name === 'save_my_sidebar_sections') return { ok: true };
        if (name === 'get_my_schedule_list') return [];
        if (name === 'get_my_notice_list') return [];
        if (name === 'get_my_promotion_workspace') return { role: currentRoute, my_items: [], review_items: [] };
        if (name === 'get_promotion_publication_admin') return { items: [] };
        if (name === 'list_public_content_change_requests') return [];
        if (name === 'list_information_publication_requests') return [];
        if (name === 'support_get_company_profile') return { profile: null, locations: [], qualifications: [], business_areas: [], partners: [], benefits: [], can_edit: true, stale_evaluation_count: 0 };
        if (name === 'support_list_notices') return [];
        if (name === 'get_attendance_admin_today') return { rows: [] };
        if (name === 'get_my_attendance_today') return { is_workday: true, attendance_required: true, clock_in: null, clock_out: null };
        return [];
      }
    };
  </script>
  <script src="../../app/assets/platform-navigation-registry.js"></script>
  <script src="../../app/assets/app-workspace-surface.js"></script>
  <script src="../../app/assets/dashboard-shell.js"></script>

  <script src="../../app/assets/operations-promotion-writer.js"></script>
  <script src="../../app/assets/operations-homepage-direct.js"></script>

  <script src="../../app/assets/promotion-approved-delete-ux.js"></script>

  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const clean = node => (node.textContent || '').replace(/\s*·\s*점검중\s*$/, '').trim();
    const directItems = () => [...document.getElementById('app-nav').children];
    const visibleItems = () => directItems().filter(node => !node.hidden && node.dataset.navSuppressed !== '1');
    const visibleLeafItems = () => visibleItems().filter(node => node.dataset.navSectionToggle !== '1');
    const itemLabel = node => (node.dataset.supportMyWorkNav || node.dataset.supportRadarNavGroup) ? '지원사업' : clean(node);
    const labels = () => visibleLeafItems().map(itemLabel);
    const find = label => visibleLeafItems().find(node => itemLabel(node) === label || clean(node) === label);
    const navSignature = () => visibleItems().map(node => {
      const section = node.dataset.sectionLabel || '';
      const inner = (node.dataset.supportMyWorkNav || node.dataset.supportRadarNavGroup)
        ? [...node.querySelectorAll('button')].map(button => button.textContent.trim()).join(',')
        : '';
      return `${itemLabel(node)}[${section}](${inner})`;
    }).join('|');

    function waitForStable(timeout = 1500) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error(`navigation stable timeout: ${currentRoute}`)), timeout);
        document.addEventListener('taejang-navigation-stable', () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });
    }

    async function assertNoPostSettleJitter(role) {
      const nav = document.getElementById('app-nav');
      assert(nav.dataset.navigationSettled === '1', `${role}: navigationSettled 플래그 누락`);
      assert(nav.style.visibility !== 'hidden', `${role}: 정착 후 사이드바가 숨겨져 있음`);
      const initial = navSignature();
      const samples = [];
      for (let index = 0; index < 8; index += 1) {
        await wait(80);
        samples.push(navSignature());
      }
      assert(samples.every(signature => signature === initial), `${role}: 정착 후 보이는 메뉴 순서/내용이 다시 변함`);
    }
    async function assertSidebarScrollStable(role) {
      const sidebar = document.getElementById('app-sidebar');
      const workspace = document.querySelector('.app-workspace');
      const shell = document.getElementById('desktop-app-shell');
      const nav = document.getElementById('app-nav');
      const sidebarStyle = getComputedStyle(sidebar);
      const workspaceStyle = getComputedStyle(workspace);
      const bodyStyle = getComputedStyle(document.body);
      assert(bodyStyle.overflow === 'hidden' || bodyStyle.overflowY === 'hidden', `${role}: 데스크톱 전체 페이지 스크롤이 남아 있음`);
      assert(sidebarStyle.position === 'relative', `${role}: sticky sidebar가 남아 있어 outer scroll과 충돌할 수 있음`);
      assert(sidebarStyle.overflowY === 'auto' || sidebarStyle.overflowY === 'scroll', `${role}: 데스크톱 사이드바가 독립 스크롤 영역이 아님`);
      assert(workspaceStyle.overflowY === 'auto' || workspaceStyle.overflowY === 'scroll', `${role}: 본문도 독립 스크롤 영역이어야 함`);
      assert(sidebarStyle.overscrollBehaviorY === 'contain', `${role}: 하단 wheel scroll chaining 방지 누락`);
      assert(sidebarStyle.overflowAnchor === 'none', `${role}: 브라우저 scroll anchoring 방지 누락`);
      assert(Math.abs(shell.getBoundingClientRect().height - window.innerHeight) < 3, `${role}: 앱 shell이 viewport 높이로 고정되지 않음`);

      const maxScroll = Math.max(0, sidebar.scrollHeight - sidebar.clientHeight);
      assert(maxScroll > 0, `${role}: 사이드바 스크롤 테스트에 필요한 overflow가 없음`);
      sidebar.scrollTop = maxScroll;
      await wait(30);
      const baseRect = sidebar.getBoundingClientRect();
      const baseline = {
        scrollTop: sidebar.scrollTop,
        scrollHeight: sidebar.scrollHeight,
        clientHeight: sidebar.clientHeight,
        top: baseRect.top,
        height: baseRect.height,
        signature: navSignature()
      };
      for (let index = 0; index < 8; index += 1) {
        await wait(80);
        const rect = sidebar.getBoundingClientRect();
        assert(Math.abs(sidebar.scrollTop - baseline.scrollTop) < 1, `${role}: 하단에서 scrollTop이 흔들림`);
        assert(sidebar.scrollHeight === baseline.scrollHeight, `${role}: 하단에서 sidebar 높이가 반복 변경됨`);
        assert(sidebar.clientHeight === baseline.clientHeight, `${role}: 하단에서 sidebar viewport 높이가 반복 변경됨`);
        assert(Math.abs(rect.top - baseline.top) < 0.51 && Math.abs(rect.height - baseline.height) < 0.51, `${role}: 하단에서 sidebar 자체 위치가 흔들림`);
        assert(navSignature() === baseline.signature, `${role}: 하단에서 메뉴 DOM이 반복 변경됨`);
      }
      sidebar.scrollTop = 0;
    }

    async function assertLateOfficialChannelsRestore() {
      const nav = document.getElementById('app-nav');
      assert(nav.querySelectorAll(':scope > [data-official-channel-link]').length === 0, '테스트 시작 시 공식 채널은 아직 미로딩 상태여야 함');

      window.TaejangOfficialChannels.list = [
        { id: 'homepage', label: '홈페이지', href: '../index.html' },
        { id: 'blog', label: '공식 블로그', href: 'https://blog.naver.com/taejang-official' },
        { id: 'youtube', label: '공식 유튜브', href: 'https://youtube.com/@taejangofficial' }
      ];
      document.dispatchEvent(new CustomEvent('taejang-official-channels-ready'));
      await wait(80);
      window.TaejangRoleNavigationPriority?.reorder?.();
      await wait(30);

      const toggle = nav.querySelector(':scope > [data-nav-section-toggle="1"][data-section-key="official_channels"]');
      const links = [...nav.querySelectorAll(':scope > [data-official-channel-link]')];
      assert(toggle, '공식 채널이 다른 카테고리와 같은 상위 접기/펼치기 구조가 아님');
      assert(toggle.querySelector('.app-nav-section-title')?.textContent.trim() === '공식 채널', '공식 채널 상위 제목 오류');
      assert(links.length === 3, '공식 채널 설정이 늦게 도착해도 링크 3개가 복구되어야 함');
      assert(links.every(link => link.dataset.navSection === 'official_channels'), '공식 채널 하위 링크가 표준 카테고리에 속하지 않음');
      assert(links.map(link => link.textContent.trim()).join('|') === '홈페이지|공식 블로그|공식 유튜브', '공식 채널 링크 순서/명칭 오류');

      toggle.click();
      await wait(20);
      assert(links.every(link => link.hidden), '공식 채널 접기가 하위 링크에 적용되지 않음');
      toggle.click();
      await wait(20);
      assert(links.every(link => !link.hidden), '공식 채널 펼치기가 하위 링크에 적용되지 않음');
    }

    async function enterRole(role, label) {
      currentRoute = role;
      const stable = waitForStable();
      document.dispatchEvent(new CustomEvent('taejang-app-ready', { detail: { route: role, label } }));
      await stable;
      await wait(80);
      return labels();
    }

    function assertOrdered(current, required, role) {
      let previous = -1;
      for (const label of required) {
        const index = current.indexOf(label);
        assert(index > previous, `${role}: ${label} 메뉴 순서 오류`);
        previous = index;
      }
    }

    const retiredLabels = [
      '복구·계정 관리', '일정 관리', '일정 캘린더',
      '공지 확인', '상시 안내 관리', '공지·안내 관리', '공지·안내 확인'
    ];

    function assertRetiredAbsent(current, role) {
      for (const label of retiredLabels) {
        assert(!current.includes(label), `${role}: retired menu reappeared: ${label}`);
      }
    }

    function assertNoDuplicateLeafLabels(role) {
      const current = visibleLeafItems()
        .filter(node => node.tagName === 'BUTTON' || node.tagName === 'A')
        .map(node => clean(node))
        .filter(Boolean);
      assert(new Set(current).size === current.length, `${role}: duplicate visible sidebar label detected`);
    }

    async function assertFocusGeometryStable(role) {
      const nodes = visibleLeafItems().filter(node => node.tagName === 'BUTTON' || node.tagName === 'A').slice(0, 12);
      const snapshot = () => nodes.map(node => {
        const box = node.getBoundingClientRect();
        return [box.left, box.top, box.width, box.height];
      });
      const baseline = snapshot();
      for (const node of nodes) {
        node.focus();
        await wait(20);
        const current = snapshot();
        current.forEach((box, index) => {
          baseline[index].forEach((value, axis) => {
            assert(Math.abs(box[axis] - value) < 0.51, `${role}: focus changed sidebar geometry`);
          });
        });
      }
      document.activeElement?.blur?.();
    }

    function assertStaffContract(current) {
      for (const required of ['대시보드', '홍보 글 작성', '보낸 글', '보완 요청받은 글']) {
        assert(current.includes(required), `홍보직원 필수 메뉴 누락: ${required}`);
      }
      assertRetiredAbsent(current, 'promotion_staff');
      assertNoDuplicateLeafLabels('promotion_staff');
    }

    function assertLeadContract(current) {
      for (const required of ['대시보드', '홍보 글 작성', '홍보 검토', '기존 글 관리', '홈페이지 내용 관리', '직원 관리', '신규 직원 등록', '출근부']) {
        assert(current.includes(required), `운영팀장 필수 메뉴 누락: ${required}`);
      }
      assertRetiredAbsent(current, 'promotion_lead');
      assertNoDuplicateLeafLabels('promotion_lead');
    }

    function assertOperationsContract(current) {
      for (const required of [
        '대시보드', '직원 관리', '신규 직원 등록', '가입 승인',
        '홍보 검토', '홍보 글 작성', '기존 글 관리',
        '홈페이지 내용 관리', '홈페이지 직접 수정',
        '업무 배정', '공지 등록', '공지 관리', '근태·급여관리', '출근부', '근태 보정',
        '기업 프로필', '지원사업 레이더', '내 지원사업', '설정'
      ]) {
        assert(current.includes(required), `운영총괄 필수 메뉴 누락: ${required}`);
      }
      assertRetiredAbsent(current, 'operations_manager');
      assertNoDuplicateLeafLabels('operations_manager');
      assertOrdered(current, ['직원 관리', '신규 직원 등록', '가입 승인'], '운영총괄 직원·계정');
      assertOrdered(current, ['홍보 글 작성', '홍보 검토', '기존 글 관리'], '운영총괄 홍보');
      assertOrdered(current, ['업무 배정', '공지 등록', '공지 관리'], '운영총괄 업무 운영');
      assertOrdered(current, ['출근부', '근태 보정', '근태·급여관리'], '운영총괄 근태·급여');
      assert(!document.getElementById('desktop-user-label').textContent.includes('undefined'), '운영총괄 상단 사용자 역할명이 undefined로 표시됨');
    }

    function assertSidebarEditorMovedOut() {
      const sidebarActions = document.querySelector('[data-sidebar-layout-actions]');
      assert(!sidebarActions, '사이드바 하단에 메뉴 편집 UI가 다시 노출됨');
      const nav = document.getElementById('app-nav');
      assert(nav.dataset.layoutEditing !== '1', '일반 사이드바가 편집 모드로 남아 있음');
      assert(nav.querySelectorAll('[data-sidebar-drag-handle]').length === 0, '일반 사이드바에 drag handle이 남아 있음');
    }

    async function assertPanelToSidebarTransitions() {
      const dashboard = document.getElementById('dashboard-main');
      const panels = ['today-admin-panel','schedule-admin-panel','notice-admin-panel','guidance-admin-panel']
        .map(id => document.getElementById(id));
      const internal = visibleLeafItems().filter(node =>
        node.tagName === 'BUTTON'
        && node.dataset.navSectionToggle !== '1'
      );
      const panelTargets = new Set(['업무 배정','공지 등록','공지 관리']);

      for (const sourcePanel of panels) {
        for (const target of internal) {
          const label = clean(target);
          dashboard.hidden = true;
          panels.forEach(panel => { panel.hidden = panel !== sourcePanel; });
          target.click();
          await wait(20);

          if (panelTargets.has(label)) {
            assert(dashboard.hidden === true, `${sourcePanel.id} → ${label}: 관리 패널 진입 시 대시보드가 동시에 노출됨`);
            assert(panels.some(panel => panel.hidden === false), `${sourcePanel.id} → ${label}: 관리 패널이 열리지 않음`);
          } else {
            assert(dashboard.hidden === false, `${sourcePanel.id} → ${label}: 이전 관리 패널 때문에 메뉴 전환이 막힘`);
            assert(panels.every(panel => panel.hidden === true), `${sourcePanel.id} → ${label}: 이전 관리 패널이 남아 있음`);
          }
        }
      }
    }

    window.addEventListener('load', async () => {
      const output = document.getElementById('result');
      try {
        let current = await enterRole('promotion_staff', '홍보직원');
        assertStaffContract(current);
        await assertNoPostSettleJitter('promotion_staff');
        await assertFocusGeometryStable('promotion_staff');

        current = await enterRole('promotion_lead', '운영팀장');
        assertLeadContract(current);
        await assertNoPostSettleJitter('promotion_lead');
        await assertFocusGeometryStable('promotion_lead');

        current = await enterRole('operations_manager', undefined);
        assertOperationsContract(current);
        await assertNoPostSettleJitter('operations_manager');
        await assertFocusGeometryStable('operations_manager');
        await assertLateOfficialChannelsRestore();
        await assertSidebarScrollStable('operations_manager');
        assertSidebarEditorMovedOut();
        await assertPanelToSidebarTransitions();

        output.textContent = 'SIDEBAR_RUNTIME_GATE_PASS';
      } catch (error) {
        output.textContent = `SIDEBAR_RUNTIME_GATE_FAIL:${error.message}`;
      }
    });
  </script>
