<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>promotion public link rendering gate</title>
</head>
<body>
  <main data-promotion-detail></main>
  <pre id="result">RUNNING</pre>
  <script>
    const contentId = '11111111-1111-4111-8111-111111111111';
    history.replaceState({}, '', '?id=' + contentId);
    const naverUrl = 'https://blog.naver.com/taejang-official/224367547159';
    const newsUrl = 'https://news.kbs.co.kr/news/pc/view/view.do?ncd=8636757&ref=A';

    window.fetch = async url => {
      const value = String(url);
      if (!value.includes('/.netlify/functions/public-promotion-feed')) {
        throw new Error('unexpected fetch: ' + value);
      }
      return new Response(JSON.stringify({
        item: {
          content_id: contentId,
          content_type: 'homepage_article',
          title: '링크 렌더링 검수',
          summary: '네이버와 일반 기사 링크 검수',
          public_body: '네이버 블로그 참고: ' + naverUrl + '\n\n일반 뉴스 참고: ' + newsUrl + '.',
          external_url: naverUrl,
          link_source_type: 'taejang_blog',
          public_media: [],
          published_date: '2026-10-07'
        }
      }), { status: 200, headers: { 'Content-Type': 'application/json' } });
    };
  </script>
  <script src="../../assets/js/promotion-detail.js"></script>
  <script>
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const assert = (condition, message) => { if (!condition) throw new Error(message); };

    window.addEventListener('load', async () => {
      const output = document.getElementById('result');
      try {
        await wait(100);
        const inlineLinks = [...document.querySelectorAll('.article-inline-link')];
        assert(inlineLinks.length === 2, '본문 URL 2개가 모두 링크로 변환되지 않음');
        assert(inlineLinks[0].href === naverUrl, '네이버 본문 링크 href 불일치');
        assert(inlineLinks[1].href === newsUrl, '일반 뉴스 본문 링크 href 불일치');
        inlineLinks.forEach(link => {
          assert(link.target === '_blank', '본문 링크 새 탭 설정 누락');
          assert(link.rel.includes('noopener') && link.rel.includes('noreferrer'), '본문 링크 rel 보호 누락');
        });

        const related = [...document.querySelectorAll('a')]
          .find(link => link.textContent.trim() === '태장 공식 블로그에서 보기 ↗');
        assert(related, '일반 태장 소식의 연결 링크 버튼 누락');
        assert(related.href === naverUrl, '연결 링크 버튼이 네이버 주소를 가리키지 않음');
        assert(related.target === '_blank', '연결 링크 버튼 새 탭 설정 누락');

        output.textContent = 'PROMOTION_PUBLIC_LINK_RENDERING_GATE_PASS';
        document.title = 'PROMOTION_PUBLIC_LINK_RENDERING_GATE_PASS';
      } catch (error) {
        output.textContent = 'PROMOTION_PUBLIC_LINK_RENDERING_GATE_FAIL:' + error.message;
        document.title = 'PROMOTION_PUBLIC_LINK_RENDERING_GATE_FAIL';
      }
    });
  </script>
</body>
</html>
