name: Public Homepage Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - "images/homepage/**"
      - "sitemap.xml"
      - "robots.txt"
      - "tests/public-homepage-main-simplification.test.js"
      - ".github/workflows/public-homepage-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-homepage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Public source and launch regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run public homepage checks
        run: node tests/public-homepage-main-simplification.test.js
