name: Public Homepage Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-homepage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Public source and launch regression
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select relevant validation
        id: scope
        run: node scripts/ci-change-scope.mjs

      - name: Set up Node.js
        if: steps.scope.outputs.public_static == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked build dependencies
        if: steps.scope.outputs.public_static == 'true'
        run: npm ci

      - name: Run public homepage checks
        if: steps.scope.outputs.public_static == 'true'
        id: public-checks
        shell: bash
        run: |
          set +e
          node scripts/run-test-group.mjs publicHomepage > public-homepage-checks.log 2>&1
          status=$?
          cat public-homepage-checks.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failure log
        if: steps.scope.outputs.public_static == 'true' && steps.public-checks.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: public-homepage-checks-log
          path: public-homepage-checks.log
          if-no-files-found: error
          retention-days: 7

      - name: Report failed checks
        if: steps.scope.outputs.public_static == 'true' && steps.public-checks.outputs.status != '0'
        run: exit 1
