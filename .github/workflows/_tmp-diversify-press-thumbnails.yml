name: Temporary diversify press thumbnails

on:
  push:
    branches:
      - content/archive-press-coverage-202608

permissions:
  contents: write

jobs:
  diversify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/archive-press-coverage-202608
          fetch-depth: 0
      - name: Diversify press thumbnails and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          external = Path('assets/js/external-content.js')
          text = external.read_text(encoding='utf-8')
          text = text.replace(
              '// 기사 사진은 언론사 저작물을 복제하지 않고 태장 자체 개소식 사진을 공통 썸네일로 사용합니다.',
              '// 기사 사진은 언론사 저작물을 복제하지 않고, 기사 내용과 가까운 태장 자체 보유 사진을 각각 다르게 사용합니다.'
          )

          mapping = {
              'press-yonhap-20260812-taejang': (
                  'assets/images/archive/opening-ceremony.webp',
                  '경남형 장애인 동행일자리 1호점 태장 개소식 전체 현장'
              ),
              'press-newsjinju-59989': (
                  'assets/images/archive/companion-job-first-store-plaque.webp',
                  '경남형 장애인 동행일자리 1호점 태장 인증·현판'
              ),
              'press-knn-191206': (
                  'assets/images/archive/naver-blog-224376710751.webp',
                  '태장 현판 제막 및 개소식 현장'
              ),
              'press-knn-191244': (
                  'assets/images/archive/naver-blog-224377482691.webp',
                  '개소식 이후 태장 작업장에서 근로자들이 업무를 진행하는 모습'
              ),
              'press-kdjob-8779': (
                  'assets/images/archive/naver-blog-224378213482.webp',
                  '태장 새 작업공간에서 근로자들이 직무 활동을 진행하는 모습'
              ),
          }

          for item_id, (thumb, alt) in mapping.items():
              p = re.compile(
                  rf"(id: '{re.escape(item_id)}'[\\s\\S]*?thumbnail: ')[^']+(',\\n\\s+thumbnailAlt: ')[^']+(')",
                  re.M,
              )
              text, count = p.subn(rf"\\1{thumb}\\2{alt}\\3", text, count=1)
              if count != 1:
                  raise SystemExit(f'failed to update {item_id}: {count}')
              path = Path(thumb)
              if not path.exists():
                  raise SystemExit(f'missing thumbnail: {thumb}')
              if path.stat().st_size > 200 * 1024:
                  raise SystemExit(f'thumbnail over 200KB: {thumb} ({path.stat().st_size})')

          external.write_text(text, encoding='utf-8')

          test = Path('tests/public-external-content.test.js')
          t = test.read_text(encoding='utf-8')
          t = t.replace(
              "const openingPhotoPath = path.join(root, 'assets/images/archive/opening-ceremony.webp');",
              "const pressThumbnailPaths = [\n  'assets/images/archive/opening-ceremony.webp',\n  'assets/images/archive/companion-job-first-store-plaque.webp',\n  'assets/images/archive/naver-blog-224376710751.webp',\n  'assets/images/archive/naver-blog-224377482691.webp',\n  'assets/images/archive/naver-blog-224378213482.webp'\n].map(file => path.join(root, file));"
          )
          t = t.replace(
              "assert.equal(fs.existsSync(openingPhotoPath), true);\nassert.ok(fs.statSync(openingPhotoPath).size <= 200 * 1024, '언론보도 공통 썸네일은 200KB 이하이어야 합니다');",
              "for (const file of pressThumbnailPaths) {\n  assert.equal(fs.existsSync(file), true, `언론보도 썸네일이 존재해야 합니다: ${file}`);\n  assert.ok(fs.statSync(file).size <= 200 * 1024, `언론보도 썸네일은 200KB 이하이어야 합니다: ${file}`);\n}"
          )
          t = t.replace(
              "assert.equal(pressItems.length, 5, '이번 언론보도 백필은 원문 링크가 확인된 5건이어야 합니다');",
              "assert.equal(pressItems.length, 5, '이번 언론보도 백필은 원문 링크가 확인된 5건이어야 합니다');\nassert.equal(new Set(pressItems.map(item => item.thumbnail)).size, 5, '언론보도 5건은 서로 다른 태장 보유 썸네일을 사용해야 합니다');"
          )
          t = t.replace(
              "['press-yonhap-20260812-taejang', ['연합뉴스', '2026-08-12', 'https://www.yna.co.kr/view/AKR20260812048100052']],\n  ['press-newsjinju-59989', ['진주신문', '2026-08-12', 'https://newsjinju.kr/news/articleView.html?idxno=59989']],\n  ['press-knn-191206', ['KNN', '2026-08-13', 'https://news.knn.co.kr/news/article/191206']],\n  ['press-knn-191244', ['KNN', '2026-08-13', 'https://news.knn.co.kr/news/article/191244']],\n  ['press-kdjob-8779', ['장애인일자리신문', '2026-08-13', 'https://kdjob.co.kr/article/8779']]",
              "['press-yonhap-20260812-taejang', ['연합뉴스', '2026-08-12', 'https://www.yna.co.kr/view/AKR20260812048100052', 'assets/images/archive/opening-ceremony.webp']],\n  ['press-newsjinju-59989', ['진주신문', '2026-08-12', 'https://newsjinju.kr/news/articleView.html?idxno=59989', 'assets/images/archive/companion-job-first-store-plaque.webp']],\n  ['press-knn-191206', ['KNN', '2026-08-13', 'https://news.knn.co.kr/news/article/191206', 'assets/images/archive/naver-blog-224376710751.webp']],\n  ['press-knn-191244', ['KNN', '2026-08-13', 'https://news.knn.co.kr/news/article/191244', 'assets/images/archive/naver-blog-224377482691.webp']],\n  ['press-kdjob-8779', ['장애인일자리신문', '2026-08-13', 'https://kdjob.co.kr/article/8779', 'assets/images/archive/naver-blog-224378213482.webp']]"
          )
          t = t.replace(
              "assert.equal(item.thumbnail, 'assets/images/archive/opening-ceremony.webp');\n  assert.match(item.thumbnailAlt, /태장 개소식/);",
              "assert.equal(item.thumbnail, expected[3]);\n  assert.ok(item.thumbnailAlt.length > 0, '언론보도 썸네일 대체텍스트가 있어야 합니다');"
          )
          test.write_text(t, encoding='utf-8')
          PY
      - name: Verify targeted public test
        run: node tests/public-external-content.test.js
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/_tmp-diversify-press-thumbnails.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/external-content.js tests/public-external-content.test.js
          git commit -m "fix: diversify press archive thumbnails"
          git push origin HEAD:content/archive-press-coverage-202608
