name: Batched Production Release
run-name: "Production release | ${{ github.event_name == 'schedule' && 'live' || 'read-only dry-run' }}"

on:
  schedule:
    # Daily wake-up; fixed 48-hour slots are computed across month/year boundaries.
    - cron: '20 8 * * *'
    # GitHub may delay or drop one cron event. Independent later wake-ups
    # are deduplicated by evaluateSchedule using the same fixed 48h slot.
    - cron: '47 8 * * *'
    - cron: '17 9 * * *'
    - cron: '47 9 * * *'
    # Final catch-up shortly before the prior 24-hour slot expires.
    # Real publication can happen after the last same-day wake-up; never
    # relax the actual 48-hour minimum or duplicate-release guards.
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: taejang-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.NETLIFY_PRODUCTION_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify fixed-slot release regressions
        run: node --test tests/scheduled-netlify-release.test.mjs
      - name: Check approved main and request one Git build only when due
        env:
          GH_TOKEN: ${{ github.token }}
          NETLIFY_PRODUCTION_BUILD_HOOK: ${{ github.event_name == 'schedule' && secrets.NETLIFY_PRODUCTION_BUILD_HOOK || '' }}
          RELEASE_RESULT_PATH: ${{ runner.temp }}/production-release-result.json
          SUPABASE_ACCESS_TOKEN: ${{ github.event_name == 'schedule' && secrets.SUPABASE_ACCESS_TOKEN || '' }}
          PRODUCTION_SUPABASE_PROJECT_REF: jgsxpdflgkqroecfjzxq
        run: node scripts/scheduled-netlify-release.mjs check deployment/release-policy.json
      - name: Retain check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-result
          path: ${{ runner.temp }}/production-release-result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Record failure
        if: failure()
        run: echo 'Release check failed. See this run. Previous published Production remains authoritative; retry at next fixed slot.' >> "$GITHUB_STEP_SUMMARY"
