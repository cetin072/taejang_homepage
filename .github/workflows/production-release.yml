name: Batched Production Release

on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Emergency release: bypass 48 hours; changes and daily cap still required'
        type: boolean
        default: false
      dry_run:
        description: 'Plan without creating a release branch, PR, or deployment'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: taejang-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    env:
      FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize temporary paths
        run: |
          echo "RELEASE_PLAN_PATH=$RUNNER_TEMP/production-release-plan.json" >> "$GITHUB_ENV"
          echo "PUBLISHED_DEPLOY_PATH=$RUNNER_TEMP/published-production.json" >> "$GITHUB_ENV"
      - name: Read successful public Production deployment
        run: curl --fail --silent --show-error --location --max-time 30 --output "$PUBLISHED_DEPLOY_PATH" "https://api.netlify.com/api/v1/sites/9caa5a1a-f86d-4a9f-aed4-f560e1c2101f"
      - name: Plan release
        id: plan
        run: node scripts/production-release-plan.mjs
      - name: Require configured release identity
        if: steps.plan.outputs.status == 'READY' && env.DRY_RUN == 'false'
        env:
          APP_ID: ${{ vars.PRODUCTION_RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.PRODUCTION_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo 'RELEASE_AUTH_NOT_CONFIGURED: configure the approved repository-scoped GitHub App' >&2
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: steps.plan.outputs.status == 'READY' && env.DRY_RUN == 'false'
        with:
          app-id: ${{ vars.PRODUCTION_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRODUCTION_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - name: Create marker-only PR, await genuine PR CI, and squash when current
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PRODUCTION_SUPABASE_PROJECT_REF: jgsxpdflgkqroecfjzxq
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$DRY_RUN" == "false" && "${{ steps.plan.outputs.status }}" == "READY" ]]; then
            gh auth setup-git
          fi
          node scripts/production-release.mjs
      - name: Verify publicly deployed squash commit
        if: steps.release.outputs.status == 'MERGED'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 15 "https://api.netlify.com/api/v1/sites/9caa5a1a-f86d-4a9f-aed4-f560e1c2101f" \
              | node --input-type=module -e 'import {publicDeployReady} from "./scripts/production-release-health.mjs";let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{try{process.exit(publicDeployReady(JSON.parse(s),process.env.RELEASE_SHA)?0:1)}catch{process.exit(1)}})'; then
              echo 'Production release confirmed at exact squash SHA'
              exit 0
            fi
            sleep 30
          done
          echo 'Production was not observed; do not retry deploy automatically' >&2
          exit 1

      - name: Report blocked or failed release on existing incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/production-release-report.mjs
