name: Notification Push

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*notification_push*'
      - 'supabase/functions/notification-dispatch/**'
      - 'scripts/notice-push-canary-draft.mjs'
      - 'mobile/src/notifications/**'
      - 'mobile/.env.example'
      - 'mobile/package.json'
      - 'tests/mobile-push-notifications.test.mjs'
      - 'tests/notification-push-*.js'
      - 'tests/notification-push-*.mjs'
      - 'supabase/tests/database/notification_push_foundation.test.sql'
      - '.github/workflows/notification-push.yml'

permissions:
  contents: read

concurrency:
  group: notification-push-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Phase 1A owns migration/lint/pgTAP and notification Auth/Data API QA.
      # Notification source and package changes select its full integration path.
      - name: Run notification dispatch and canary contracts
        run: node --test tests/notification-push-dispatch.test.mjs tests/notification-push-canary-draft.test.mjs
