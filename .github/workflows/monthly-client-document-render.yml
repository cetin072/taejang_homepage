name: Monthly Client Document Render
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/assets/monthly-client-document*'
      - 'tests/monthly-client-document*'
      - '.github/workflows/monthly-client-document-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install local document renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk poppler-utils
      - name: Verify actual three and twelve page PDFs with complete text
        env:
          MONTHLY_RENDER_OUTPUT: monthly-document-render-artifacts
        run: node tests/monthly-client-document-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-document-synthetic-render
          path: monthly-document-render-artifacts/
          if-no-files-found: ignore
