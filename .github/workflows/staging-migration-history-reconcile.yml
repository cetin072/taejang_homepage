name: Staging Owned Migration Reconcile 306

on:
  push:
    branches:
      - chore/306-staging-migration-history-reconcile
    paths:
      - .github/workflows/staging-migration-history-reconcile.yml
      - scripts/staging/owned-migration-status.mjs

permissions:
  contents: read

concurrency:
  group: taejang-staging-owned-migration-reconcile-306
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-first-super-admin
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_REF: jgsxpdflgkqroecfjzxq
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved staging target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "chore/306-staging-migration-history-reconcile" ]] || { echo "STOP_UNAPPROVED_BRANCH"; exit 1; }
          [[ "$STAGING_PROJECT_REF" == "jgsxpdflgkqroecfjzxq" ]] || { echo "STOP_UNAPPROVED_STAGING_REF"; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "STOP_STAGING_ACCESS_TOKEN_MISSING"; exit 1; }

      - name: Export remote migration history
        shell: bash
        run: |
          set -euo pipefail
          query="select version, name from supabase_migrations.schema_migrations order by version;"
          jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @- > /tmp/remote.json

      - name: Classify this repository's owned migrations
        shell: bash
        run: node scripts/staging/owned-migration-status.mjs /tmp/remote.json /tmp/owned-status.json

      - name: Verify schema evidence for legacy-applied owned migrations
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          query="
          select
            (to_regclass('public.homepage_change_requests') is not null) as homepage_change_requests_table,
            (to_regprocedure('public.create_homepage_change_request(text,text,text,text,text,text,text,text)') is not null) as homepage_create_rpc,
            (to_regprocedure('public.get_homepage_change_requests()') is not null) as homepage_list_rpc,
            (to_regprocedure('public.review_homepage_change_request(uuid,text,text)') is not null) as homepage_review_rpc,
            (select count(*)::int from public.platform_capabilities
              where code in ('support_radar.management_view','support_radar.management_edit','support_radar.assigned_work')
                and active) as support_capability_count,
            (select count(*)::int
               from public.role_capability_grants grant_row
               join public.roles role on role.id = grant_row.role_id
              where grant_row.capability_code in ('support_radar.management_view','support_radar.assigned_work')
                and role.code in ('ceo','department_lead','promotion_lead','promotion_staff','worker_support_lead','worker_support_staff','office_staff')
            ) as support_role_grant_count,
            position(
              'PROMOTION_UNPUBLISHED_ARCHIVE_UPPER_REVIEW_LOCKED'
              in coalesce(pg_get_functiondef(to_regprocedure('public.archive_unpublished_promotion_content(uuid,text)')), '')
            ) > 0 as archive_guard_signature,
            exists(select 1 from pg_type where typnamespace='public'::regnamespace and typname='field_time_block') as field_time_block_type,
            (to_regclass('public.work_group_employee_memberships') is not null) as field_memberships_table,
            (to_regclass('public.field_work_templates') is not null) as field_templates_table,
            (to_regclass('public.field_assignment_employee_overrides') is not null) as field_overrides_table,
            (to_regclass('public.notification_devices') is not null) as notification_devices_table,
            (to_regclass('public.notification_events') is not null) as notification_events_table,
            (to_regclass('public.notification_deliveries') is not null) as notification_deliveries_table;
          "
          jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @- > /tmp/schema-evidence.json
          row="$(jq -c 'if type=="array" then .[0] elif (.result? | type)=="array" then .result[0] else empty end' /tmp/schema-evidence.json)"
          [[ -n "$row" && "$row" != "null" ]] || { echo "STOP_SCHEMA_EVIDENCE_RESPONSE"; exit 1; }
          echo "SCHEMA_EVIDENCE=$row"

          [[ "$(printf '%s' "$row" | jq -r '.homepage_change_requests_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.homepage_create_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.homepage_list_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.homepage_review_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.support_capability_count')" == "3" ]]
          [[ "$(printf '%s' "$row" | jq -r '.support_role_grant_count')" == "7" ]]

          # These three are expected to be genuinely absent before this task applies them.
          [[ "$(printf '%s' "$row" | jq -r '.archive_guard_signature')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_time_block_type')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_memberships_table')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_templates_table')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_overrides_table')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_devices_table')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_events_table')" == "false" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_deliveries_table')" == "false" ]]

      - name: Record legacy-applied owned migration versions only
        shell: bash
        run: |
          set -euo pipefail
          query="
          insert into supabase_migrations.schema_migrations(version, name, statements)
          values
            ('20260903154500','phase_c_homepage_change_requests',array[]::text[]),
            ('20260911150000','support_radar_capability_contract',array[]::text[])
          on conflict (version) do nothing;
          "
          jq -n --arg query "$query" '{query:$query,read_only:false}' |
            curl --fail --silent --show-error --retry 1 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @- > /tmp/history-add.json
          jq -e . /tmp/history-add.json >/dev/null

      - name: Apply exactly three genuinely missing owned migrations
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20260913070500_issue_192_upper_review_archive_guard.sql
            supabase/migrations/20260915150000_issue_218_field_operations_foundation.sql
            supabase/migrations/20260918133000_notification_push_foundation.sql
          )
          for file in "${files[@]}"; do
            version="$(basename "$file" | cut -d_ -f1)"
            name="$(basename "$file" .sql | cut -d_ -f2-)"
            echo "APPLY_OWNED_MIGRATION=$version $name"
            jq -Rs '{query: ., read_only:false}' "$file" |
              curl --fail --silent --show-error --retry 1 --request POST                 "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"                 --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"                 --header "Content-Type: application/json"                 --data-binary @- > "/tmp/apply-${version}.json"
            jq -e . "/tmp/apply-${version}.json" >/dev/null

            query="insert into supabase_migrations.schema_migrations(version,name,statements)
                   values ('${version}','${name}',array[]::text[])
                   on conflict (version) do nothing;"
            jq -n --arg query "$query" '{query:$query,read_only:false}' |
              curl --fail --silent --show-error --retry 1 --request POST                 "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"                 --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"                 --header "Content-Type: application/json"                 --data-binary @- >/dev/null
          done

      - name: Verify owned schema after apply
        shell: bash
        run: |
          set -euo pipefail
          query="
          select
            position(
              'PROMOTION_UNPUBLISHED_ARCHIVE_UPPER_REVIEW_LOCKED'
              in coalesce(pg_get_functiondef(to_regprocedure('public.archive_unpublished_promotion_content(uuid,text)')), '')
            ) > 0 as archive_guard_signature,
            exists(select 1 from pg_type where typnamespace='public'::regnamespace and typname='field_time_block') as field_time_block_type,
            (to_regclass('public.work_group_employee_memberships') is not null) as field_memberships_table,
            (to_regclass('public.field_work_templates') is not null) as field_templates_table,
            (to_regclass('public.field_assignment_employee_overrides') is not null) as field_overrides_table,
            (to_regclass('public.notification_devices') is not null) as notification_devices_table,
            (to_regclass('public.notification_events') is not null) as notification_events_table,
            (to_regclass('public.notification_deliveries') is not null) as notification_deliveries_table,
            exists(select 1 from pg_trigger where tgrelid='public.notices'::regclass and tgname='notices_queue_native_push' and not tgisinternal) as notification_trigger,
            (select count(*)::int from supabase_migrations.schema_migrations
              where version in ('20260903154500','20260911150000','20260913070500','20260915150000','20260918133000')
            ) as reconciled_history_count;
          "
          jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @- > /tmp/post-schema.json
          row="$(jq -c 'if type=="array" then .[0] elif (.result? | type)=="array" then .result[0] else empty end' /tmp/post-schema.json)"
          echo "POST_SCHEMA=$row"
          [[ "$(printf '%s' "$row" | jq -r '.archive_guard_signature')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_time_block_type')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_memberships_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_templates_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.field_overrides_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_devices_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_events_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_deliveries_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notification_trigger')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.reconciled_history_count')" == "5" ]]

      - name: Re-export remote history and verify repository ownership coverage
        shell: bash
        run: |
          set -euo pipefail
          query="select version, name from supabase_migrations.schema_migrations order by version;"
          jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @- > /tmp/remote-after.json
          node scripts/staging/owned-migration-status.mjs /tmp/remote-after.json /tmp/owned-after.json
          node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/owned-after.json','utf8'));
          console.log('OWNED_FINAL=' + JSON.stringify(s.counts));
          if (s.localUnmatched.length !== 0) {
            console.error('STOP_LOCAL_OWNED_MIGRATIONS_STILL_UNACCOUNTED');
            console.error(JSON.stringify(s.localUnmatched));
            process.exit(1);
          }
          // Remote-only rows are deliberately preserved because the Supabase staging
          // project is shared with other Taejang repositories.
          console.log('REMOTE_ONLY_PRESERVED=' + JSON.stringify(s.remoteUnmatched));
          NODE

      - name: Run staging safety regression
        run: npm run test:staging-safety
