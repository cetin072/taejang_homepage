name: Hero Article Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-article:
    name: Article photo and existing video slides
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Ensure Korean fonts for readable public screenshots
        shell: bash
        run: |
          if [ -z "$(fc-list :lang=ko family)" ]; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fi
      - run: npm run build:netlify
      - run: node tests/hero-article-browser.mjs
        env:
          HERO_QA_OUTPUT: hero-qa-artifacts
      - name: Verify salt arch landscape and product packs
        run: node tests/salt-origin-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salt-origin-320-390-1440
          path: salt-qa-artifacts/
          if-no-files-found: ignore
      - name: Verify archive editorial cards and search
        run: node tests/archive-editorial-browser.mjs
      - name: Verify ERP editorial selection and order controls
        run: node tests/promotion-editorial-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-editorial-320-390-786-1440
          path: archive-editorial-qa/
          if-no-files-found: ignore
      - name: Verify public SEO content and source presentation
        run: node tests/public-seo-content-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-seo-320-390-1440
          path: seo-qa-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-article-320-390-1440
          path: hero-qa-artifacts/
          if-no-files-found: ignore
