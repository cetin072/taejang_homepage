name: Hero Article Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero-article:
    name: Article photo and existing video slides
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:netlify
      - run: node tests/hero-article-browser.mjs
        env:
          HERO_QA_OUTPUT: hero-qa-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-article-320-390-1440
          path: hero-qa-artifacts/
          if-no-files-found: ignore
