name: Payroll Attendance Accuracy

on:
  pull_request:
    paths:
      - 'docs/operations/PAYROLL_ATTENDANCE_IMPORT_APPS_SCRIPT.gs'
      - 'app/payroll/**'
      - 'app/assets/payroll-*.js'
      - 'app/assets/payroll-operator.css'
      - 'prototypes/payroll-backend/**'
      - 'tests/payroll-*.test.js'
      - 'scripts/test-manifest.mjs'
      - 'scripts/run-test-group.mjs'
      - 'package.json'
      - '.github/workflows/payroll-attendance-accuracy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-payroll-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run payroll regression from shared manifest
        run: npm run test:payroll
