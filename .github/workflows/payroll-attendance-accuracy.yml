name: Payroll Attendance Accuracy

on:
  pull_request:
    paths:
      - 'docs/operations/PAYROLL_ATTENDANCE_IMPORT_APPS_SCRIPT.gs'
      - 'app/payroll/**'
      - 'app/assets/payroll-engine.js'
      - 'app/assets/payroll-golden-compat.js'
      - 'app/assets/payroll-repository.js'
      - 'app/assets/payroll-service.js'
      - 'app/assets/payroll-sheet-bridge.js'
      - 'app/assets/payroll-term-validator.js'
      - 'app/assets/payroll-operator-workflow.js'
      - 'app/assets/payroll-operator-preview.js'
      - 'app/assets/payroll-operator.css'
      - 'prototypes/payroll-backend/**'
      - 'tests/payroll-attendance-import.test.js'
      - 'tests/payroll-engine.test.js'
      - 'tests/payroll-golden-compat.test.js'
      - 'tests/payroll-rate-guard.test.js'
      - 'tests/payroll-backend-contract.test.js'
      - 'tests/payroll-service.test.js'
      - 'tests/payroll-sheet-bridge.test.js'
      - 'tests/payroll-term-validator.test.js'
      - 'tests/payroll-operator-workflow.test.js'
      - 'tests/payroll-preview.test.js'
      - '.github/workflows/payroll-attendance-accuracy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-payroll-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run anonymous payroll regression
        run: >-
          node --test
          tests/payroll-attendance-import.test.js
          tests/payroll-engine.test.js
          tests/payroll-golden-compat.test.js
          tests/payroll-rate-guard.test.js
          tests/payroll-backend-contract.test.js
          tests/payroll-service.test.js
          tests/payroll-sheet-bridge.test.js
          tests/payroll-term-validator.test.js
          tests/payroll-operator-workflow.test.js
          tests/payroll-preview.test.js
