name: PR81 Update YouTube Test Expectations

on:
  push:
    branches:
      - codex/add-youtube-vlog-20260824

permissions:
  contents: write

jobs:
  update-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-youtube-vlog-20260824
          fetch-depth: 0
      - name: Update archive regression expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('tests/public-homepage-main-simplification.test.js')
          text = main_path.read_text(encoding='utf-8')
          replacements = {
              "assert.equal(actualHubItems.length, 12, '소식·기록은 두 환경정비 활동을 포함한 공개 콘텐츠를 함께 표시합니다');":
                  "assert.equal(actualHubItems.length, 13, '소식·기록은 두 환경정비 활동과 새 환경정비 브이로그를 포함한 공개 콘텐츠를 함께 표시합니다');",
              "  'activity-environment-cleanup-second',\n  'activity-terrarium-business-start-2026-08',":
                  "  'activity-environment-cleanup-second',\n  'youtube-mIb0wN_Wi8w',\n  'activity-terrarium-business-start-2026-08',",
              "  '두 번째 환경정비 활동을 진행했습니다',\n  '테라리움 제조사업을 시작합니다',":
                  "  '두 번째 환경정비 활동을 진행했습니다',\n  '[태장 브이로그] 8월 24일, 더운 날씨 속에서도 정말 뿌듯했던 환경정비 활동',\n  '테라리움 제조사업을 시작합니다',",
              "assert.deepEqual(Array.from(actualRecentItems, item => item.title), ['두 번째 환경정비 활동을 진행했습니다', '테라리움 제조사업을 시작합니다', '경남형 동행일자리사업 1호점 태장㈜ 개소식 축하영상 | 창원특례시장', '경남형 장애인 동행일자리 1호점 태장㈜ 개소식 축하영상 | 경상남도지사', '태장 소개영상', \"[현장] '경남형 장애인 동행일자리' 1호점 가보니\", '태장의 새로운 사업장이 문을 열었습니다', '한 줄 한 줄 정성으로 완성되는 태장의 하루']);":
                  "assert.deepEqual(Array.from(actualRecentItems, item => item.title), ['두 번째 환경정비 활동을 진행했습니다', '[태장 브이로그] 8월 24일, 더운 날씨 속에서도 정말 뿌듯했던 환경정비 활동', '테라리움 제조사업을 시작합니다', '경남형 동행일자리사업 1호점 태장㈜ 개소식 축하영상 | 창원특례시장', '경남형 장애인 동행일자리 1호점 태장㈜ 개소식 축하영상 | 경상남도지사', '태장 소개영상', \"[현장] '경남형 장애인 동행일자리' 1호점 가보니\", '태장의 새로운 사업장이 문을 열었습니다']);",
              "assert.equal(actualRecentItems[4].thumbnail, 'https://i.ytimg.com/vi/FbEOcteBSJ4/hqdefault.jpg');":
                  "assert.equal(actualRecentItems[5].thumbnail, 'https://i.ytimg.com/vi/FbEOcteBSJ4/hqdefault.jpg');",
              "assert.equal(actualRecentItems[4].thumbnailAlt, '태장 공식 소개영상 썸네일');":
                  "assert.equal(actualRecentItems[5].thumbnailAlt, '태장 공식 소개영상 썸네일');",
              "assert.equal(actualRecentItems[4].externalUrl, 'https://www.youtube.com/watch?v=FbEOcteBSJ4');":
                  "assert.equal(actualRecentItems[5].externalUrl, 'https://www.youtube.com/watch?v=FbEOcteBSJ4');",
              "assert.deepEqual(Array.from(actualHubItems.filter(item => item.source === 'youtube' && item.publisher === '태장 공식 유튜브'), item => item.id), ['youtube-qvqNyeyfQsA', 'youtube-8x7yg5YBK9g', 'youtube-FbEOcteBSJ4']);":
                  "assert.deepEqual(Array.from(actualHubItems.filter(item => item.source === 'youtube' && item.publisher === '태장 공식 유튜브'), item => item.id), ['youtube-mIb0wN_Wi8w', 'youtube-qvqNyeyfQsA', 'youtube-8x7yg5YBK9g', 'youtube-FbEOcteBSJ4']);",
              "assert.equal(actualRecentItems[2].externalUrl, 'https://www.youtube.com/watch?v=qvqNyeyfQsA');":
                  "assert.equal(actualRecentItems[3].externalUrl, 'https://www.youtube.com/watch?v=qvqNyeyfQsA');",
              "assert.equal(actualRecentItems[3].externalUrl, 'https://www.youtube.com/watch?v=8x7yg5YBK9g');":
                  "assert.equal(actualRecentItems[4].externalUrl, 'https://www.youtube.com/watch?v=8x7yg5YBK9g');",
              "assert.equal(actualRecentItems[5].externalUrl, 'https://www.youtube.com/watch?v=8x4Rf3knAb8');":
                  "assert.equal(actualRecentItems[6].externalUrl, 'https://www.youtube.com/watch?v=8x4Rf3knAb8');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected main-test fragment: {old[:100]}')
              text = text.replace(old, new, 1)
          marker = "assert.equal(actualRecentItems[5].externalUrl, 'https://www.youtube.com/watch?v=FbEOcteBSJ4');\n"
          vlog_assertions = (
              "assert.equal(actualRecentItems[1].id, 'youtube-mIb0wN_Wi8w');\n"
              "assert.equal(actualRecentItems[1].thumbnail, 'https://i.ytimg.com/vi/mIb0wN_Wi8w/hqdefault.jpg');\n"
              "assert.equal(actualRecentItems[1].externalUrl, 'https://www.youtube.com/watch?v=mIb0wN_Wi8w');\n"
          )
          if marker not in text:
              raise SystemExit('missing insertion marker for vlog assertions')
          text = text.replace(marker, marker + vlog_assertions, 1)
          main_path.write_text(text, encoding='utf-8')

          ext_path = Path('tests/public-external-content.test.js')
          text = ext_path.read_text(encoding='utf-8')
          text = text.replace('assert.equal(window.TAEJANG_CONTENT.hub.length, 6);', 'assert.equal(window.TAEJANG_CONTENT.hub.length, 7);', 1)
          text = text.replace("const knn = window.TAEJANG_CONTENT.hub.find(item => item.id === 'youtube-8x4Rf3knAb8');", "const vlog = window.TAEJANG_CONTENT.hub.find(item => item.id === 'youtube-mIb0wN_Wi8w');\nconst knn = window.TAEJANG_CONTENT.hub.find(item => item.id === 'youtube-8x4Rf3knAb8');", 1)
          marker = "assert.equal(youtube.publishedAt, '2026-08-13');\n"
          vlog_block = """

assert.equal(vlog.type, 'external');
assert.equal(vlog.source, 'youtube');
assert.equal(vlog.publisher, '태장 공식 유튜브');
assert.equal(vlog.category, 'ESG·사회공헌');
assert.equal(vlog.title, '[태장 브이로그] 8월 24일, 더운 날씨 속에서도 정말 뿌듯했던 환경정비 활동');
assert.equal(vlog.status, 'published');
assert.equal(vlog.publishedAt, '2026-08-24');
assert.equal(vlog.externalUrl, 'https://www.youtube.com/watch?v=mIb0wN_Wi8w');
assert.equal(vlog.thumbnail, 'https://i.ytimg.com/vi/mIb0wN_Wi8w/hqdefault.jpg');
assert.equal(vlog.externalLabel, '유튜브에서 보기');
"""
          if marker not in text:
              raise SystemExit('missing external-test insertion marker')
          text = text.replace(marker, marker + vlog_block, 1)
          text = text.replace("assert.equal(window.TAEJANG_CONTENT.hub.length, 6, '같은 외부 콘텐츠를 중복 등록하지 않습니다');", "assert.equal(window.TAEJANG_CONTENT.hub.length, 7, '같은 외부 콘텐츠를 중복 등록하지 않습니다');", 1)
          ext_path.write_text(text, encoding='utf-8')
          PY
      - name: Commit test updates and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr81-update-youtube-test-expectations.yml
          git add tests/public-homepage-main-simplification.test.js tests/public-external-content.test.js
          git diff --cached --check
          git commit -m "test: update archive expectations for environment vlog"
          git push origin HEAD:codex/add-youtube-vlog-20260824
