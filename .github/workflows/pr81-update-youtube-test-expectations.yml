name: PR81 Test Updater

on:
  push:
    branches:
      - codex/add-youtube-vlog-20260824

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-youtube-vlog-20260824
          fetch-depth: 0
      - name: Update test expectations
        run: python scripts/pr81_fix_tests.py
      - name: Verify updated focused tests
        run: |
          node tests/public-homepage-main-simplification.test.js
          node tests/public-external-content.test.js
      - name: Commit updated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr81-update-youtube-test-expectations.yml scripts/pr81_fix_tests.py
          git add tests/public-homepage-main-simplification.test.js tests/public-external-content.test.js
          git diff --cached --check
          git commit -m "test: update archive expectations for environment vlog"
          git push origin HEAD:codex/add-youtube-vlog-20260824
