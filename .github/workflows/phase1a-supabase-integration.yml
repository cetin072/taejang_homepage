# tests/operations-public-text-edit-auth.mjs runs through phase1a-auth-integration.mjs.
name: Phase 1A Supabase Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/erp-sale-ledgers-640]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1a-supabase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Migration, pgTAP, Auth and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether full platform integration is relevant
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          printf '%s\n' "$changed_files"

          # Fail safe: run the full integration suite for every change except
          # documentation-only pull requests. New code/config paths therefore
          # cannot silently fall outside a hand-maintained allow-list.
          non_docs="$(printf '%s\n' "$changed_files" | grep -Ev '^(docs/|[^/]+\.md$)' || true)"
          if [[ -n "$changed_files" && -z "$non_docs" ]]; then
            echo "run_full=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report lightweight pass for unrelated changes
        if: steps.scope.outputs.run_full != 'true'
        run: echo "Documentation-only change; required check is satisfied without starting Supabase."

      - name: Run active static platform checks
        if: steps.scope.outputs.run_full == 'true'
        run: node scripts/run-test-group.mjs platformStatic

      - name: Run active staging safety checks
        if: steps.scope.outputs.run_full == 'true'
        run: node scripts/run-test-group.mjs stagingSafety

      - name: Install existing browser dependency for real isolated workflow QA
        if: steps.scope.outputs.run_full == 'true'
        run: npm ci

      - name: Install Korean font for staff form QA
        if: steps.scope.outputs.run_full == 'true'
        timeout-minutes: 5
        run: |
          if [ -z "$(fc-list :lang=ko family)" ]; then
            # Official Google Fonts source, SIL OFL 1.1. Avoid unrelated APT index downloads.
            mkdir -p "$HOME/.local/share/fonts"
            curl --fail --location --retry 2 --max-time 90 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' -o "$HOME/.local/share/fonts/NotoSansKR.ttf"
            fc-cache -f
          fi
          test -n "$(fc-list :lang=ko family)"

      - name: Test ERP persisted workflows and PC mobile UI in isolated PostgreSQL
        if: steps.scope.outputs.run_full == 'true'
        run: |
          ERP_TEST_PRODUCT_AUTOMATION=1 node tests/erp-sales-isolated.mjs
          ERP_TEST_PRODUCT_AUTOMATION=1 node tests/erp-sales-amount-adjustments.mjs
          node tests/erp-product-automation-isolated.mjs
          CHROME_PATH=$(command -v google-chrome) node tests/erp-product-automation-browser.mjs
          CHROME_PATH=$(command -v google-chrome) node tests/erp-sales-browser.mjs
          CHROME_PATH=$(command -v google-chrome) node tests/erp-sales-usability.mjs

      - name: Keep synthetic ERP browser screenshots
        if: always() && steps.scope.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: erp-sales-1440-390
          path: admin-ui-qa-artifacts/erp-sales/
          if-no-files-found: ignore
          retention-days: 7

      # Reuse npm ci's locked CLI instead of downloading a second version.
      - name: Use repository-locked Supabase CLI
        if: steps.scope.outputs.run_full == 'true'
        run: |
          cli_expected=$(node -p "require('./package-lock.json').packages['node_modules/supabase'].version")
          cli_actual=$(./node_modules/.bin/supabase --version)
          test "$cli_actual" = "$cli_expected"
          printf '%s\n' "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Supabase CLI $cli_actual (repository lockfile)"

      - name: Start isolated local Supabase
        if: steps.scope.outputs.run_full == 'true'
        run: supabase start

      - name: Test candidate personal menu authority in isolated PostgreSQL
        if: steps.scope.outputs.run_full == 'true'
        run: node tests/menu-authority-isolated.mjs

      - name: Test personal menu authority administration with synthetic browser data
        if: steps.scope.outputs.run_full == 'true'
        run: CHROME_PATH=$(command -v google-chrome) node tests/menu-authority-browser.mjs

      - name: Reapply migrations from a clean database
        if: steps.scope.outputs.run_full == 'true'
        run: supabase db reset

      - name: Lint database schema
        if: steps.scope.outputs.run_full == 'true'
        run: supabase db lint --level error --fail-on error

      - name: Inspect isolated security advisors
        if: steps.scope.outputs.run_full == 'true'
        run: supabase db advisors --local --type security --level warn --fail-on error

      - name: Run pgTAP security tests
        if: steps.scope.outputs.run_full == 'true'
        run: supabase test db supabase/tests/database/*.test.sql

      - name: Run real Auth and Data API integration
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        run: |
          supabase status -o env > /tmp/taejang-supabase.env
          set -a
          source /tmp/taejang-supabase.env
          set +a
          node tests/mobile-optional-release-auth-integration.mjs
          # Claim global outbox before other suites publish notice fixtures.
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/notification-push-auth-integration.mjs
          # tests/operations-owned-promotion-auth.mjs runs inside the Phase 1A Auth fixtures below.
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/phase1a-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/capability-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/monthly-client-documents-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/erp-sales-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/attendance-capability-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/employee-capability-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/issue-309-sensitive-identity-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/employee-recovery-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/account-capability-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/attendance-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/payroll-draft-handoff-auth-integration.mjs
          # Imports tests/helpers/today-board-browser-flow.mjs against this local DB only.
          TODAY_BOARD_BROWSER_QA=1 SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/today-board-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/staff-schedules-notices-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/notice-review-media-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/frequent-staff-guidance-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/support-radar-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/field-operations-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/issue-221-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/issue-274-mobile-onboarding-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/issue-456-field-audit-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/goal-375-self-profile-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/qa-account-preview-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/issue-254-attendance-payroll-e2e.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/issue-255-payslip-draft-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/audit-service-role-immutable-integration.mjs
          # Run after first-super-admin bootstrap and all historical ledgers exist.
          git fetch origin 90cf9d6af8490b005d1a8ae0865cdd85c133460c
          node tests/employee-password-reset-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/employee-leave-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/google-email-release-auth-integration.mjs
          SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/worklog-readonly-auth-integration.mjs
          CHROME_PATH=$(command -v google-chrome) SUPABASE_PROJECT_ID=taejang-homepage-phase1a node tests/employee-calendar-auth-integration.mjs

      - name: Keep synthetic employee calendar screenshots
        if: always() && steps.scope.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: employee-calendar-320-390-1440
          path: employee-calendar-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test leave administration browser flow
        if: steps.scope.outputs.run_full == 'true'
        run: CHROME_PATH=$(command -v google-chrome) node tests/employee-leave-browser.mjs

      - name: Keep synthetic work time PC and mobile screenshots
        if: always() && steps.scope.outputs.run_full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: leave-admin-390-1440
          path: leave-admin-qa-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always() && steps.scope.outputs.run_full == 'true'
        run: |
          if command -v supabase >/dev/null; then supabase stop --no-backup; fi
