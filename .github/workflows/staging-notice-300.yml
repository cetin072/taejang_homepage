name: Staging Notice 300 Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taejang-staging-notice-300-verify
  cancel-in-progress: false

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-first-super-admin
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_PROJECT_REF: jgsxpdflgkqroecfjzxq
      TARGET_VERSION: "20260921002000"
    steps:
      - name: Verify approved staging target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_PROJECT_REF" == "jgsxpdflgkqroecfjzxq" ]] || { echo "STOP_UNAPPROVED_STAGING_REF"; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "STOP_STAGING_SECRET_MISSING"; exit 1; }

      - name: Verify Issue 300 hosted schema and security metadata
        shell: bash
        run: |
          set -euo pipefail
          query="
          select
            (select count(*)::int from supabase_migrations.schema_migrations where version = '${TARGET_VERSION}') as history_count,
            (to_regclass('public.notice_media') is not null) as notice_media_table,
            coalesce((
              select relrowsecurity from pg_class
              where oid='public.notice_media'::regclass
            ), false) as notice_media_rls,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='notices'
                and column_name in ('review_state','submitted_for_review_at','submitted_for_review_by','reviewed_at','reviewed_by')
            ) as review_column_count,
            exists (
              select 1 from storage.buckets
              where id='notice-media' and public=false and file_size_limit=8388608
            ) as private_bucket,
            (select count(*)::int from pg_policies
              where schemaname='storage' and tablename='objects'
                and policyname in ('notice media upload','notice media read','notice media delete')
            ) as storage_policy_count,
            (to_regprocedure('public.submit_notice_for_operations_review(uuid,text)') is not null) as submit_rpc,
            (to_regprocedure('public.add_notice_media(uuid,text,text,text,integer)') is not null) as add_media_rpc,
            (to_regprocedure('public.update_notice_media(uuid,text,integer)') is not null) as update_media_rpc,
            (to_regprocedure('public.archive_notice_media(uuid,text)') is not null) as archive_media_rpc,
            (to_regprocedure('public.current_user_can_view_notice(uuid)') is not null) as view_guard_rpc;
          "
          response="$(jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @-)"
          row="$(printf '%s' "$response" | jq -c 'if type=="array" then .[0] elif (.result? | type)=="array" then .result[0] else empty end')"
          [[ -n "$row" && "$row" != "null" ]] || { echo "STOP_VERIFY_RESPONSE"; exit 1; }
          printf '%s' "$row" | jq -c .
          [[ "$(printf '%s' "$row" | jq -r '.history_count')" == "1" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notice_media_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notice_media_rls')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.review_column_count')" == "5" ]]
          [[ "$(printf '%s' "$row" | jq -r '.private_bucket')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.storage_policy_count')" == "3" ]]
          [[ "$(printf '%s' "$row" | jq -r '.submit_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.add_media_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.update_media_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.archive_media_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.view_guard_rpc')" == "true" ]]
          echo "ISSUE_300_STAGING_SCHEMA_RLS_METADATA_VERIFIED"
