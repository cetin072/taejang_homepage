name: Staging Notice 300 Migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: "dry_run checks the approved staging migration; apply pushes it."
        required: true
        type: choice
        options: [dry_run, apply]
      approval:
        description: "For apply, type APPLY_NOTICE_300_STAGING exactly"
        required: false
        type: string
  push:
    branches:
      - feat/notice-ops-review-photo
    paths:
      - .github/workflows/staging-notice-300.yml

permissions:
  contents: read

concurrency:
  group: taejang-staging-notice-300
  cancel-in-progress: false

jobs:
  staging-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-first-super-admin
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_REF: jgsxpdflgkqroecfjzxq
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Verify target and credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_PROJECT_REF" == "jgsxpdflgkqroecfjzxq" ]] || { echo "STOP_UNAPPROVED_STAGING_REF"; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] || { echo "STOP_STAGING_SECRETS_MISSING"; exit 1; }
      - name: Link approved staging project
        run: supabase link --project-ref "$STAGING_PROJECT_REF"
      - name: Read-only migration inventory
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list || true
          query="select version, name from supabase_migrations.schema_migrations order by version;"
          response="$(jq -n --arg query "$query" '{ query: $query, read_only: true }' | curl --fail --silent --show-error --retry 2 --request POST "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query" --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" --header "Content-Type: application/json" --data-binary @-)"
          printf '%s' "$response" | jq -r 'if type == "array" then . elif .result? and (.result | type == "array") then .result else [] end | "REMOTE_MIGRATION_COUNT=\(length)", (.[] | "\(.version)\t\(.name // "")")'
      - name: Migration dry-run
        if: github.event_name == 'workflow_dispatch'
        run: supabase db push --dry-run
      - name: Apply migration
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && inputs.approval == 'APPLY_NOTICE_300_STAGING'
        run: supabase db push
      - name: Require exact apply approval
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && inputs.approval != 'APPLY_NOTICE_300_STAGING'
        run: echo "STOP_NOTICE_300_APPROVAL_REQUIRED" && exit 1
