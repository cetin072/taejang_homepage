name: Staging Notice 300 Migration

on:
  push:
    branches:
      - feat/notice-ops-review-photo
    paths:
      - .github/workflows/staging-notice-300.yml

permissions:
  contents: read

concurrency:
  group: taejang-staging-notice-300
  cancel-in-progress: false

jobs:
  apply-targeted-staging-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-first-super-admin
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      STAGING_PROJECT_REF: jgsxpdflgkqroecfjzxq
      TARGET_VERSION: "20260921002000"
      TARGET_PATH: supabase/migrations/20260921002000_issue_300_notice_review_media.sql
      TARGET_BLOB_SHA: f6e03e23ff34a82a1ae8182d0b1a389800fe0ca9
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Verify one-time staging target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == "feat/notice-ops-review-photo" ]] || { echo "STOP_UNAPPROVED_BRANCH"; exit 1; }
          [[ "$STAGING_PROJECT_REF" == "jgsxpdflgkqroecfjzxq" ]] || { echo "STOP_UNAPPROVED_STAGING_REF"; exit 1; }
          [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_DB_PASSWORD" ]] || { echo "STOP_STAGING_SECRETS_MISSING"; exit 1; }
          [[ -f "$TARGET_PATH" ]] || { echo "STOP_TARGET_MIGRATION_MISSING"; exit 1; }
          actual_blob="$(git hash-object "$TARGET_PATH")"
          [[ "$actual_blob" == "$TARGET_BLOB_SHA" ]] || { echo "STOP_TARGET_MIGRATION_CHANGED"; exit 1; }
          echo "TARGET_MIGRATION_VERIFIED=$TARGET_VERSION"

      - name: Link approved staging project
        run: supabase link --project-ref "$STAGING_PROJECT_REF"

      - name: Preflight no partial Issue 300 schema
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          query="
          select
            (select count(*)::int from supabase_migrations.schema_migrations where version = '${TARGET_VERSION}') as history_count,
            (to_regclass('public.notice_media') is not null) as notice_media_table,
            exists (
              select 1 from information_schema.columns
              where table_schema='public' and table_name='notices' and column_name='review_state'
            ) as review_state_column,
            exists (select 1 from storage.buckets where id='notice-media') as bucket_exists;
          "
          response="$(jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @-)"
          row="$(printf '%s' "$response" | jq -c 'if type=="array" then .[0] elif (.result? | type)=="array" then .result[0] else empty end')"
          [[ -n "$row" && "$row" != "null" ]] || { echo "STOP_PREFLIGHT_RESPONSE"; exit 1; }
          history="$(printf '%s' "$row" | jq -r '.history_count')"
          media="$(printf '%s' "$row" | jq -r '.notice_media_table')"
          review="$(printf '%s' "$row" | jq -r '.review_state_column')"
          bucket="$(printf '%s' "$row" | jq -r '.bucket_exists')"
          echo "PREFLIGHT history=$history media=$media review=$review bucket=$bucket"
          if [[ "$history" == "1" ]]; then
            [[ "$media" == "true" && "$review" == "true" && "$bucket" == "true" ]] || {
              echo "STOP_HISTORY_WITH_PARTIAL_SCHEMA"; exit 1;
            }
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          elif [[ "$history" == "0" ]]; then
            [[ "$media" == "false" && "$review" == "false" && "$bucket" == "false" ]] || {
              echo "STOP_PARTIAL_ISSUE_300_SCHEMA"; exit 1;
            }
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          else
            echo "STOP_DUPLICATE_MIGRATION_HISTORY"; exit 1
          fi

      - name: Apply only Issue 300 migration in one transaction
        if: steps.preflight.outputs.already_applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{query: ., read_only: false}' "$TARGET_PATH" |
            curl --fail --silent --show-error --retry 1 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @- > /tmp/issue300-apply.json
          jq -e . /tmp/issue300-apply.json >/dev/null
          if jq -e 'type=="object" and ((.error? != null) or (.message? != null and .message != ""))' /tmp/issue300-apply.json >/dev/null; then
            echo "STOP_ISSUE_300_SQL_ERROR"
            jq -c '{error:(.error // null),message:(.message // null)}' /tmp/issue300-apply.json
            exit 1
          fi
          echo "ISSUE_300_SQL_APPLIED"

      - name: Record only Issue 300 migration version
        if: steps.preflight.outputs.already_applied == 'false'
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair --status applied "$TARGET_VERSION"
          echo "ISSUE_300_HISTORY_RECORDED=$TARGET_VERSION"

      - name: Verify hosted schema, private bucket and RLS metadata
        shell: bash
        run: |
          set -euo pipefail
          query="
          select
            (select count(*)::int from supabase_migrations.schema_migrations where version = '${TARGET_VERSION}') as history_count,
            (to_regclass('public.notice_media') is not null) as notice_media_table,
            coalesce((
              select relrowsecurity from pg_class
              where oid='public.notice_media'::regclass
            ), false) as notice_media_rls,
            (select count(*)::int from information_schema.columns
              where table_schema='public' and table_name='notices'
                and column_name in ('review_state','submitted_for_review_at','submitted_for_review_by','reviewed_at','reviewed_by')
            ) as review_column_count,
            exists (
              select 1 from storage.buckets
              where id='notice-media' and public=false and file_size_limit=8388608
            ) as private_bucket,
            (select count(*)::int from pg_policies
              where schemaname='storage' and tablename='objects'
                and policyname in ('notice media upload','notice media read','notice media delete')
            ) as storage_policy_count,
            (to_regprocedure('public.submit_notice_for_operations_review(uuid,text)') is not null) as submit_rpc,
            (to_regprocedure('public.add_notice_media(uuid,text,text,text,integer)') is not null) as add_media_rpc,
            (to_regprocedure('public.update_notice_media(uuid,text,integer)') is not null) as update_media_rpc,
            (to_regprocedure('public.archive_notice_media(uuid,text)') is not null) as archive_media_rpc,
            (to_regprocedure('public.current_user_can_view_notice(uuid)') is not null) as view_guard_rpc;
          "
          response="$(jq -n --arg query "$query" '{query:$query,read_only:true}' |
            curl --fail --silent --show-error --retry 2 --request POST               "https://api.supabase.com/v1/projects/${STAGING_PROJECT_REF}/database/query"               --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"               --header "Content-Type: application/json"               --data-binary @-)"
          row="$(printf '%s' "$response" | jq -c 'if type=="array" then .[0] elif (.result? | type)=="array" then .result[0] else empty end')"
          [[ -n "$row" && "$row" != "null" ]] || { echo "STOP_POSTCHECK_RESPONSE"; exit 1; }
          printf '%s' "$row" | jq -c .
          [[ "$(printf '%s' "$row" | jq -r '.history_count')" == "1" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notice_media_table')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.notice_media_rls')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.review_column_count')" == "5" ]]
          [[ "$(printf '%s' "$row" | jq -r '.private_bucket')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.storage_policy_count')" == "3" ]]
          [[ "$(printf '%s' "$row" | jq -r '.submit_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.add_media_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.update_media_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.archive_media_rpc')" == "true" ]]
          [[ "$(printf '%s' "$row" | jq -r '.view_guard_rpc')" == "true" ]]
          echo "ISSUE_300_STAGING_SCHEMA_RLS_METADATA_VERIFIED"
