name: Temporary Payroll Base Sync

on:
  push:
    branches:
      - codex/goal-142-payroll-operator-mvp
    paths:
      - '.github/workflows/payroll-base-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout payroll operator branch
        uses: actions/checkout@v4
        with:
          ref: codex/goal-142-payroll-operator-mvp
          fetch-depth: 0

      - name: Guard target and merge refreshed payroll base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/goal-142-payroll-operator-mvp"
          git fetch origin codex/issue-111-payroll-accuracy-mvp
          git config user.name "taejang-payroll-sync"
          git config user.email "actions@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/codex/issue-111-payroll-accuracy-mvp
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts found:\n%s\n' "${conflicts[*]}"
            for path in "${conflicts[@]}"; do
              case "$path" in
                app/assets/role-navigation-priority.js|scripts/test-manifest.mjs) ;;
                *) echo "STOP: unexpected merge conflict: $path"; exit 1 ;;
              esac
            done
            git checkout --theirs -- app/assets/role-navigation-priority.js scripts/test-manifest.mjs
            git add app/assets/role-navigation-priority.js scripts/test-manifest.mjs
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          test -z "$unresolved" || { echo "STOP: unresolved conflicts"; printf '%s\n' "$unresolved"; exit 1; }
          git add -A
          git commit -m "chore: sync refreshed payroll base into operator MVP"
          git push origin HEAD:codex/goal-142-payroll-operator-mvp
