name: Promotion Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: promotion-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-gate:
    name: Promotion representative browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Chrome runtime
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Run promotion browser QA gate
        run: node scripts/run-promotion-browser-gate.mjs

      - name: Install existing browser dependency
        run: npm ci

      - name: Run notice authoring exact viewport QA
        env:
          NOTICE_QA_OUTPUT: notice-qa-artifacts
        run: node tests/notice-authoring-browser.mjs

      - name: Run attendance PC and mobile fixture QA
        env:
          ATTENDANCE_QA_OUTPUT: attendance-qa-artifacts
        run: node tests/issue-426-attendance-browser.mjs

      - name: Run employee list and profile PC and mobile fixture QA
        env:
          EMPLOYEE_QA_OUTPUT: employee-qa-artifacts
        run: node tests/issue-451-employee-profile-browser.mjs

      - name: Run employee-app landing browser QA at PC and mobile sizes
        env:
          EMPLOYEE_APP_QA_OUTPUT: employee-app-qa-artifacts
        run: |
          npm run build:netlify
          node tests/employee-app-browser.mjs

      - name: Verify employee-app landing on exact-head Deploy Preview
        if: github.event_name == 'pull_request'
        env:
          UAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          EMPLOYEE_APP_QA_OUTPUT: employee-app-preview-qa-artifacts
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          import os
          import pathlib
          spec = importlib.util.spec_from_file_location('uar', '.github/scripts/user_acceptance_ready.py')
          uar = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(uar)
          contract = uar.load_contract(pathlib.Path('.github/user-acceptance-ready.json'))
          preview = uar.wait_for_preview(contract, os.environ.copy())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'EMPLOYEE_APP_QA_BASE={preview}\n')
          PYTHON
          node tests/employee-app-browser.mjs

      - name: Keep exact-head Preview screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-app-preview-qa
          path: employee-app-preview-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep employee app landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-app-landing-1440-390-320
          path: employee-app-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic employee screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-list-profile-1440-390
          path: employee-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic attendance screenshots and XLSX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-pc-mobile-xlsx
          path: attendance-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic notice authoring screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-authoring-320-390-1280
          path: notice-qa-artifacts/
          if-no-files-found: ignore
