name: Promotion Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promotion-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-gate:
    name: Promotion representative browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Chrome runtime
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Run promotion browser QA gate
        run: node scripts/run-promotion-browser-gate.mjs

      - name: Install existing browser dependency
        run: npm ci

      - name: Run notice authoring exact viewport QA
        env:
          NOTICE_QA_OUTPUT: notice-qa-artifacts
        run: node tests/notice-authoring-browser.mjs

      - name: Run attendance PC and mobile fixture QA
        env:
          ATTENDANCE_QA_OUTPUT: attendance-qa-artifacts
        run: node tests/issue-426-attendance-browser.mjs

      - name: Run employee list and profile PC and mobile fixture QA
        env:
          EMPLOYEE_QA_OUTPUT: employee-qa-artifacts
        run: node tests/issue-451-employee-profile-browser.mjs

      - name: Run staff field audit PC and mobile fixture QA
        env:
          FIELD_AUDIT_QA_OUTPUT: field-audit-qa-artifacts
        run: node tests/issue-456-field-audit-browser.mjs

      - name: Keep staff field audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-field-audit-1440-390
          path: field-audit-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic employee screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-list-profile-1440-390
          path: employee-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic attendance screenshots and XLSX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-pc-mobile-xlsx
          path: attendance-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic notice authoring screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-authoring-320-390-1280
          path: notice-qa-artifacts/
          if-no-files-found: ignore
