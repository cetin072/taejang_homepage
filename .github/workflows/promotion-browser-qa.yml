name: Promotion Browser QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: promotion-browser-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-gate:
    name: Promotion representative browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Chrome runtime
        shell: bash
        run: |
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser

      - name: Install existing browser dependency
        run: npm ci

      - name: Verify monthly documents and menu addresses with isolated fixtures
        run: |
          node tests/monthly-client-documents-browser.mjs
          node tests/platform-menu-addresses-browser.mjs

      - name: Run promotion browser QA gate
        run: node scripts/run-promotion-browser-gate.mjs

      - name: Verify employee credential reset PC and mobile flow
        run: node tests/employee-password-reset-browser.mjs

      - name: Verify employee reset assets on exact-head Preview
        if: github.event_name == 'pull_request'
        env:
          UAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('uar', '.github/scripts/user_acceptance_ready.py')
          uar = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(uar)
          contract = uar.load_contract(pathlib.Path('.github/user-acceptance-ready.json'))
          preview = uar.wait_for_preview(contract, os.environ.copy())
          subprocess.run(['node', 'tests/employee-password-reset-browser.mjs'],
                         env={**os.environ, 'EMPLOYEE_PREVIEW_URL': preview}, check=True)
          PYTHON



      - name: Run synthetic admin UI keyboard and form QA
        env:
          ADMIN_UI_QA_OUTPUT: admin-ui-qa-artifacts
        run: node tests/admin-ui-browser.mjs

      - name: Verify admin target preservation and accepted-save recovery
        env:
          STABILITY_QA_OUTPUT: backend-stability-qa-artifacts
        run: node tests/backend-stability-browser.mjs

      - name: Verify shared authoring controls and original functional gates
        env:
          AUTHORING_QA_OUTPUT: authoring-ui-qa-artifacts
        run: node tests/admin-authoring-browser.mjs

      - name: Verify shared authoring on exact-head Deploy Preview
        if: github.event_name == 'pull_request'
        env:
          UAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTHORING_QA_OUTPUT: authoring-ui-preview-qa-artifacts
          CORRECTION_QA_OUTPUT: authoring-ui-preview-qa-artifacts/attendance-correction
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('uar', '.github/scripts/user_acceptance_ready.py')
          uar = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(uar)
          contract = uar.load_contract(pathlib.Path('.github/user-acceptance-ready.json'))
          preview = uar.wait_for_preview(contract, os.environ.copy())
          subprocess.run(['node', 'tests/admin-authoring-browser.mjs'], check=True,
                         env={**os.environ, 'PREVIEW_URL': preview})
          subprocess.run(['node', 'tests/attendance-correction-browser.mjs'], check=True,
                         env={**os.environ, 'PREVIEW_URL': preview})
          subprocess.run(['node', 'tests/backend-stability-browser.mjs'], check=True,
                         env={**os.environ, 'PREVIEW_URL': preview,
                              'STABILITY_QA_OUTPUT': 'backend-stability-preview-qa-artifacts'})
          PYTHON

      - name: Keep shared authoring screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-authoring-1440-768-390-320
          path: |
            authoring-ui-qa-artifacts/
            authoring-ui-preview-qa-artifacts/
            backend-stability-qa-artifacts/
            backend-stability-preview-qa-artifacts/
          if-no-files-found: ignore

      - name: Run employee sorting and notice saved-result role QA
        env:
          ADMIN_UI_QA_OUTPUT: admin-ui-qa-artifacts
        run: node tests/admin-employee-notice-browser.mjs

      - name: Keep synthetic admin UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-320-390-768-1440
          path: admin-ui-qa-artifacts/
          if-no-files-found: ignore

      - name: Run real mouse sidebar drag/save/reload QA
        env:
          SIDEBAR_DRAG_QA_OUTPUT: sidebar-drag-qa-artifacts
        run: node tests/issue-466-sidebar-real-drag.mjs

      - name: Run notice authoring exact viewport QA
        env:
          NOTICE_QA_OUTPUT: notice-qa-artifacts
        run: node tests/notice-authoring-browser.mjs

      - name: Capture notice management before change
        if: github.event_name == 'pull_request'
        env:
          NOTICE_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
          NOTICE_HISTORY_QA_OUTPUT: notice-history-qa-artifacts
        run: |
          git fetch --no-tags --depth=1 origin "$NOTICE_BASELINE_REF"
          node tests/notice-management-browser.mjs

      - name: Run notice history, same-ID correction and archive role QA
        env:
          NOTICE_HISTORY_QA_OUTPUT: notice-history-qa-artifacts
        run: node tests/notice-management-browser.mjs

      - name: Verify independent notice bootstrap on local and exact-head Preview
        env:
          UAR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTICE_INIT_QA_OUTPUT: notice-history-qa-artifacts/initialization
        run: |
          node tests/notice-initialization-browser.mjs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 - <<'PYTHON'
          import importlib.util, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('uar', '.github/scripts/user_acceptance_ready.py')
          uar = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(uar)
          preview = uar.wait_for_preview(uar.load_contract(pathlib.Path('.github/user-acceptance-ready.json')), os.environ.copy())
          subprocess.run(['node', 'tests/notice-initialization-browser.mjs'], check=True,
                         env={**os.environ, 'PREVIEW_URL': preview})
          PYTHON
          fi

      - name: Keep notice history PC and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-history-390-1440
          path: notice-history-qa-artifacts/
          if-no-files-found: ignore

      - name: Run promotion composer exact viewport QA
        env:
          PROMOTION_QA_OUTPUT: promotion-composer-qa-artifacts
        run: |
          node tests/promotion-composer-browser.mjs
          node tests/official-blog-photo-browser.mjs

      - name: Keep promotion composer screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-composer-320-390-768-1440
          path: promotion-composer-qa-artifacts
          if-no-files-found: ignore

      - name: Run attendance PC and mobile fixture QA
        env:
          ATTENDANCE_QA_OUTPUT: attendance-qa-artifacts
          CORRECTION_QA_OUTPUT: attendance-qa-artifacts/correction
        run: |
          node tests/issue-426-attendance-browser.mjs
          node tests/attendance-correction-browser.mjs

      - name: Run employee list and profile PC and mobile fixture QA
        env:
          EMPLOYEE_QA_OUTPUT: employee-qa-artifacts
        run: node tests/issue-451-employee-profile-browser.mjs

      - name: Run staff field audit PC and mobile fixture QA
        env:
          FIELD_AUDIT_QA_OUTPUT: field-audit-qa-artifacts
        run: node tests/issue-456-field-audit-browser.mjs

      - name: Keep staff field audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-field-audit-1440-390
          path: field-audit-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic employee screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-list-profile-1440-390
          path: employee-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic attendance screenshots and XLSX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-pc-mobile-xlsx
          path: attendance-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep synthetic notice authoring screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-authoring-320-390-1280
          path: notice-qa-artifacts/
          if-no-files-found: ignore

  employee-app-gate:
    name: Employee app landing local and exact-head Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact-head Preview origin normalization
        run: python3 tests/preview-status-origin-test.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install existing browser dependency
        run: npm ci

      - name: Run employee-app landing browser QA at PC and mobile sizes
        env:
          EMPLOYEE_APP_QA_OUTPUT: employee-app-qa-artifacts
        run: |
          npm run build:netlify
          node tests/employee-app-browser.mjs

      - name: Verify employee-app landing on exact-head Deploy Preview
        if: github.event_name == 'pull_request'
        env:
          UAR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          EMPLOYEE_APP_QA_OUTPUT: employee-app-preview-qa-artifacts
          EMPLOYEE_APP_QA_REQUIRE_HOSTED: "1"
        run: |
          python3 - <<'PYTHON'
          import importlib.util
          import os
          import pathlib
          import subprocess
          spec = importlib.util.spec_from_file_location('uar', '.github/scripts/user_acceptance_ready.py')
          uar = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(uar)
          contract = uar.load_contract(pathlib.Path('.github/user-acceptance-ready.json'))
          import traceback
          def annotate(message):
              message = message[-5000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Employee app Hosted Preview::' + message, flush=True)
          try:
              preview = uar.wait_for_preview(contract, os.environ.copy())
              result = subprocess.run(['node', 'tests/employee-app-browser.mjs'], text=True,
                                      capture_output=True, env={**os.environ, 'EMPLOYEE_APP_QA_BASE': preview})
              print(result.stdout, end='')
              print(result.stderr, end='')
              if result.returncode:
                  annotate(result.stderr or result.stdout)
              raise SystemExit(result.returncode)
          except Exception:
              annotate(traceback.format_exc())
              raise
          PYTHON

      - name: Keep exact-head Preview screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-app-preview-qa
          path: employee-app-preview-qa-artifacts/
          if-no-files-found: ignore

      - name: Keep employee app landing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employee-app-landing-1440-390-320
          path: employee-app-qa-artifacts/
          if-no-files-found: ignore
