name: Temporary Cleanup Thumbnail QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/_tmp-cleanup-thumbnail-qa.yml'

permissions:
  contents: write

jobs:
  crop-thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Re-encode first cleanup photo as archive thumbnail
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          path = Path('assets/images/archive/environment-cleanup-first.webp')
          image = Image.open(path).convert('RGB')
          thumb = ImageOps.fit(
              image,
              (720, 405),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.5),
          )
          thumb.save(path, 'WEBP', quality=82, method=6)
          check = Image.open(path)
          assert check.size == (720, 405), check.size
          assert path.stat().st_size < 200 * 1024, path.stat().st_size
          print(f'{path}: {check.size}, {path.stat().st_size} bytes')
          PY
      - name: Commit optimized thumbnail to PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/archive/environment-cleanup-first.webp
          if git diff --cached --quiet; then
            echo "No thumbnail change"
            exit 0
          fi
          git commit -m "fix: optimize first cleanup archive thumbnail"
          git push origin "HEAD:${HEAD_REF}"
