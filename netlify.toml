[build]
  command = "node scripts/scheduled-netlify-release.mjs guard deployment/release-policy.json && npm run build:netlify"
  ignore = "node ./scripts/scheduled-netlify-release.mjs ignore"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
