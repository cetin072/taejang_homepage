<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>내 비밀번호 변경 | 태장</title>
<link rel="stylesheet" href="assets/staff.css"><link rel="stylesheet" href="assets/login.css"></head>
<body><main class="staff-shell"><header class="staff-header"><a class="staff-brand" href="./">태장</a><a class="text-button" href="./">로그인으로 돌아가기</a></header>
<section class="panel auth-panel"><h1>내 비밀번호 변경</h1>
<p class="help">운영총괄에게 받은 로그인 아이디와 임시 비밀번호로 본인 확인 후, 이메일을 열지 않고 새 비밀번호로 바꿀 수 있습니다.</p>
<div id="change-message" role="status" aria-live="polite" class="message" hidden></div>
<form id="change-password-form" novalidate>
<label>1. 로그인 아이디<input name="email" type="email" autocomplete="username" required></label>
<label>2. 현재 비밀번호 (임시 비밀번호)<input name="current_password" type="password" autocomplete="current-password" minlength="8" required></label>
<label>3. 새 비밀번호<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label>
<label>4. 새 비밀번호 확인<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" required></label>
<p class="help">8자 이상, 기존 비밀번호와 다르게 정하세요. 새로운 비밀번호는 본인만 기억하세요.</p>
<button id="change-submit" class="button" type="submit">내 비밀번호 변경하기</button>
</form><p class="help">현재 비밀번호를 모르시면 운영총괄에게 문의하세요.</p></section></main>
<script type="module" src="assets/change-password.js"></script></body></html>
