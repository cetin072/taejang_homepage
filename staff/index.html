<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>임직원 로그인 | 태장</title>
  <link rel="stylesheet" href="assets/staff.css">
  <link rel="stylesheet" href="assets/login.css">
</head>
<body>
  <main class="staff-shell">
    <header class="staff-header">
      <a href="../index.html" class="staff-brand" aria-label="태장 홈페이지로 이동">태장</a>
      <button id="logout-button" class="button button-quiet" type="button" hidden>로그아웃</button>
    </header>

    <div id="message" class="message" role="status" aria-live="polite" hidden></div>

    <section id="setup-panel" class="panel" hidden>
      <h2>로그인을 준비하고 있습니다</h2>
      <p>잠시 후 다시 시도해 주세요.</p>
    </section>

    <section id="start-panel" class="start-panel-trigger" hidden aria-hidden="true">
      <button id="show-login" type="button">로그인</button>
    </section>

    <section id="login-panel" class="panel auth-panel" hidden aria-labelledby="login-title">
      <h1 id="login-title">임직원 로그인</h1>
      <form id="login-form" novalidate>
        <label>아이디
          <input name="email" type="email" autocomplete="username" aria-describedby="login-email-error" required>
        </label>
        <p id="login-email-error" class="field-error" role="alert" hidden></p>
        <label>비밀번호
          <input name="password" type="password" autocomplete="current-password" minlength="8" aria-describedby="login-password-error" required>
        </label>
        <p id="login-password-error" class="field-error" role="alert" hidden></p>
        <button class="button" type="submit">로그인</button>
      </form>
      <div class="auth-links">
        <button id="show-signup" class="text-button" type="button">가입 신청</button>
      </div>
    </section>

    <section id="signup-panel" class="panel auth-panel" hidden aria-labelledby="signup-title">
      <button class="text-button" type="button" data-back-to-start>← 로그인</button>
      <h2 id="signup-title">가입 신청</h2>
      <form id="signup-form" novalidate>
        <label>이름
          <input name="display_name" type="text" autocomplete="name" maxlength="80" aria-describedby="signup-name-error" required>
        </label>
        <p id="signup-name-error" class="field-error" role="alert" hidden></p>
        <label>아이디
          <input name="email" type="email" autocomplete="email" aria-describedby="signup-email-error" required>
        </label>
        <p id="signup-email-error" class="field-error" role="alert" hidden></p>
        <label>비밀번호
          <input name="password" type="password" autocomplete="new-password" minlength="8" aria-describedby="signup-password-error" required>
        </label>
        <p id="signup-password-error" class="field-error" role="alert" hidden></p>
        <label>비밀번호 확인
          <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" aria-describedby="signup-password-confirm-error" required>
        </label>
        <p id="signup-password-confirm-error" class="field-error" role="alert" hidden></p>
        <label class="consent-row">
          <input name="privacy_consent" type="checkbox" required>
          <span>가입 신청에 필요한 정보 수집 및 이용에 동의합니다.</span>
        </label>
        <p id="signup-consent-error" class="field-error" role="alert" hidden></p>
        <button class="button button-secondary" type="submit">가입 신청</button>
      </form>
    </section>

    <section id="pending-panel" class="panel state-panel" hidden>
      <h2>승인 대기 중입니다</h2>
      <p>관리자 승인 후 로그인할 수 있습니다.</p>
      <div class="action-stack compact">
        <button id="refresh-status" class="button" type="button">승인 상태 확인</button>
      </div>
    </section>

    <section id="blocked-panel" class="panel state-panel" hidden>
      <h2>로그인할 수 없습니다</h2>
      <p id="blocked-copy">계정 상태를 담당자에게 확인하세요.</p>
    </section>

    <section id="unassigned-panel" class="panel state-panel" hidden>
      <h2>사용 권한을 준비하고 있습니다</h2>
      <p>담당자에게 문의해 주세요.</p>
    </section>

    <section id="issue-panel" class="panel state-panel" hidden>
      <span class="state-icon" aria-hidden="true">⚠️</span>
      <h2 id="issue-title">업무 화면을 열 수 없습니다</h2>
      <p id="issue-copy">로그인 상태는 유지되어 있습니다. 잠시 후 다시 시도하세요.</p>
      <div class="action-stack compact">
        <button id="retry-app" class="button" type="button">업무 화면 다시 열기</button>
      </div>
    </section>

    <section id="admin-panel" class="panel" hidden>
      <div class="section-heading">
        <div>
          <p class="eyebrow">관리자</p>
          <h2>가입 승인 대기</h2>
        </div>
        <button id="refresh-pending" class="button button-quiet" type="button">새로고침</button>
      </div>
      <p class="help">실제 소속을 확인한 사람만 부서·직책·역할을 배정하고 승인하세요.</p>
      <p><a class="button button-quiet" href="../app/">업무 대시보드 열기</a></p>
      <div id="pending-list" class="account-list"></div>
    </section>
  </main>
  <script src="assets/auth-routing.js"></script>
  <script src="assets/staff.js" defer></script>
  <script src="assets/login-entry.js" defer></script>
</body>
</html>
