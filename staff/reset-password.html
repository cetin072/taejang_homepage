<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>비밀번호 재설정 | 태장</title>
  <link rel="stylesheet" href="assets/staff.css">
  <link rel="stylesheet" href="assets/login.css">
</head>
<body>
  <main class="staff-shell">
    <header class="staff-header">
      <a href="../index.html" class="staff-brand" aria-label="태장 홈페이지로 이동">태장</a>
    </header>

    <div id="reset-message" class="message" role="status" aria-live="polite" hidden></div>

    <section id="reset-loading" class="panel auth-panel">
      <h1>비밀번호 재설정</h1>
      <p>재설정 링크를 확인하고 있습니다.</p>
    </section>

    <section id="reset-form-panel" class="panel auth-panel" hidden>
      <h1>새 비밀번호 설정</h1>
      <p class="help">새 비밀번호를 8자 이상 입력하세요.</p>
      <form id="reset-password-form" novalidate>
        <label>새 비밀번호
          <input name="password" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <label>새 비밀번호 확인
          <input name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>
        </label>
        <button class="button" type="submit">비밀번호 변경</button>
      </form>
    </section>

    <section id="reset-success" class="panel auth-panel" hidden>
      <h1>변경 완료</h1>
      <p>비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.</p>
      <p><a class="button" href="./">임직원 로그인</a></p>
    </section>

    <section id="reset-invalid" class="panel auth-panel" hidden>
      <h1>재설정 링크를 사용할 수 없습니다</h1>
      <p>링크가 만료됐거나 이미 사용됐을 수 있습니다. 다시 재설정 메일을 요청하세요.</p>
      <p><a class="button" href="./">로그인 화면으로</a></p>
    </section>
  </main>
  <script src="assets/reset-password.js" defer></script>
</body>
</html>
