<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>태장 Staging 실제 계정 검수</title>
  <style>
    :root { color-scheme: light; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f4f7f5; color: #17231d; }
    body { height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    .qa-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #fff3cd;
      border-bottom: 1px solid #e4c970;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      z-index: 2;
    }
    .qa-bar__copy { min-width: 0; flex: 1; }
    .qa-bar strong { display: block; color: #7a2f00; font-size: .95rem; }
    .qa-bar span { display: block; margin-top: 2px; color: #4b3b00; font-size: .78rem; line-height: 1.4; }
    .qa-actions { display: flex; gap: 8px; flex: 0 0 auto; }
    button {
      min-height: 36px;
      border-radius: 9px;
      border: 1px solid #b7a14f;
      background: #fff;
      color: #2f2a14;
      font-weight: 800;
      padding: 7px 11px;
      cursor: pointer;
    }
    button:hover { background: #fff9e7; }
    .qa-stage { min-height: 0; position: relative; }
    .qa-stage iframe { width: 100%; height: 100%; border: 0; background: #fff; display: none; }
    .qa-state {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .qa-state[hidden] { display: none !important; }
    .qa-card {
      max-width: 560px;
      background: #fff;
      border: 1px solid #dbe5df;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,.08);
    }
    .qa-card h1 { margin: 0 0 10px; font-size: 1.25rem; }
    .qa-card p { margin: 0; line-height: 1.6; color: #56655e; }
    .qa-card.is-error h1 { color: #a22020; }
    .qa-mobile-actions { display: none; }
    @media (max-width: 720px) {
      .qa-bar { align-items: flex-start; flex-wrap: wrap; padding: 8px 12px; }
      .qa-bar__copy span { display: none; }
      .qa-bar strong { font-size: .88rem; }
      .qa-actions { display: none; }
      .qa-mobile-actions {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom));
        z-index: 30;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
        gap: 8px;
        padding: 8px;
        border: 1px solid #d6c777;
        border-radius: 16px;
        background: rgba(255, 248, 218, .96);
        box-shadow: 0 10px 30px rgba(0,0,0,.22);
        backdrop-filter: blur(8px);
      }
      .qa-mobile-actions button {
        min-height: 56px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 1rem;
      }
      .qa-mobile-actions .qa-mobile-return {
        background: #174f38;
        border-color: #174f38;
        color: #fff;
      }
      .qa-stage { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header class="qa-bar">
    <div class="qa-bar__copy">
      <strong id="qa-title">Staging 실제 계정 검수 준비 중</strong>
      <span>이 탭만 선택한 사용자의 실제 Auth 세션과 실제 RLS로 동작합니다. 원래 운영총괄 탭은 유지됩니다. Production에서는 사용하지 않습니다.</span>
    </div>
    <div class="qa-actions">
      <button type="button" id="qa-reload" hidden>화면 새로고침</button>
      <button type="button" id="qa-close">검수 탭 닫기</button>
    </div>
  </header>
  <main class="qa-stage">
    <div class="qa-state" id="qa-state">
      <div class="qa-card" id="qa-card">
        <h1 id="qa-state-title">실제 계정 세션을 확인하고 있습니다.</h1>
        <p id="qa-state-copy">잠시만 기다려 주세요.</p>
      </div>
    </div>
    <iframe id="qa-frame" title="선택한 실제 사용자 계정의 태장 업무플랫폼" referrerpolicy="no-referrer" sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
  </main>
  <div class="qa-mobile-actions" id="qa-mobile-actions" hidden>
    <button type="button" id="qa-mobile-reload">화면 새로고침</button>
    <button type="button" id="qa-mobile-return" class="qa-mobile-return">운영총괄로 돌아가기</button>
  </div>
  <script>
    (() => {
      'use strict';

      const SESSION_KEY = 'taejang-staff-session-v1';
      const QA_MARKER_KEY = 'taejang-qa-account-preview-v1';
      const QA_HANDOFF_KEY = 'taejang-qa-account-handoff-v1';
      const STAGING_PROJECT_REF = 'jgsxpdflgkqroecfjzxq';
      const frame = document.getElementById('qa-frame');
      const state = document.getElementById('qa-state');
      const card = document.getElementById('qa-card');
      const title = document.getElementById('qa-title');
      const stateTitle = document.getElementById('qa-state-title');
      const stateCopy = document.getElementById('qa-state-copy');
      const reload = document.getElementById('qa-reload');
      const mobileActions = document.getElementById('qa-mobile-actions');
      const mobileReload = document.getElementById('qa-mobile-reload');
      const mobileReturn = document.getElementById('qa-mobile-return');

      function fail(message) {
        card.classList.add('is-error');
        stateTitle.textContent = '실제 계정 검수를 시작하지 못했습니다.';
        stateCopy.textContent = message;
        state.hidden = false;
        state.style.display = 'grid';
        frame.style.display = 'none';
        mobileActions.hidden = true;
      }

      function decodeJwtSubject(token) {
        try {
          const payload = token.split('.')[1];
          if (!payload) return null;
          const normalized = payload.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(payload.length / 4) * 4, '=');
          return JSON.parse(atob(normalized))?.sub || null;
        } catch {
          return null;
        }
      }

      function readOperatorSession() {
        try {
          const stored = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
          if (stored?.access_token) return stored;
        } catch { /* try opener next */ }
        try {
          const openerSession = window.opener?.TaejangApp?.getSession?.();
          if (openerSession?.access_token) return openerSession;
        } catch { /* handled below */ }
        throw new Error('QA_OPERATOR_SESSION_MISSING');
      }

      function readSelectedTarget() {
        try {
          const stored = JSON.parse(sessionStorage.getItem(QA_HANDOFF_KEY) || 'null');
          if (stored?.target_profile_id) {
            sessionStorage.removeItem(QA_HANDOFF_KEY);
            return {
              targetProfileId: stored.target_profile_id,
              targetName: stored.target_name || '선택 사용자'
            };
          }
        } catch {
          sessionStorage.removeItem(QA_HANDOFF_KEY);
        }

        try {
          if (!window.opener || window.opener.closed) throw new Error('QA_OPENER_UNAVAILABLE');
          const select = window.opener.document.querySelector('[data-qa-account-select]');
          const targetProfileId = select?.value || '';
          const selected = select?.selectedOptions?.[0];
          const targetName = selected?.dataset?.displayName || selected?.textContent?.split(' — ')[0]?.trim() || '선택 사용자';
          if (!targetProfileId) throw new Error('QA_TARGET_MISSING');
          return { targetProfileId, targetName };
        } catch (error) {
          if (error?.message?.startsWith('QA_')) throw error;
          throw new Error('QA_OPENER_UNAVAILABLE');
        }
      }

      async function loadConfig() {
        const response = await fetch('/.netlify/functions/staff-config', { cache: 'no-store' });
        if (!response.ok) throw new Error('CONFIG_UNAVAILABLE');
        const config = await response.json();
        if (!config.url || !config.publishableKey) throw new Error('CONFIG_INCOMPLETE');
        const configUrl = new URL(config.url);
        const localHost = ['localhost', '127.0.0.1'].includes(configUrl.hostname);
        const previewHost = window.location.hostname.startsWith('deploy-preview-') && window.location.hostname.endsWith('--taejang-homepage.netlify.app');
        if (!(localHost || (previewHost && configUrl.hostname === `${STAGING_PROJECT_REF}.supabase.co`))) throw new Error('QA_STAGING_ONLY');
        return config;
      }

      async function createPreviewToken(config, operatorSession, targetProfileId) {
        const subject = decodeJwtSubject(operatorSession.access_token);
        if (!subject) throw new Error('QA_OPERATOR_IDENTITY_MISSING');
        const response = await fetch(`${config.url}/functions/v1/qa-account-preview`, {
          method: 'POST',
          headers: {
            apikey: config.publishableKey,
            Authorization: `Bearer ${operatorSession.access_token}`,
            'X-QA-Context-Profile-ID': subject,
            'X-QA-Access-Profile-ID': subject,
            'X-QA-JWT-Subject': subject,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ action: 'create', target_profile_id: targetProfileId })
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.token_hash) throw new Error(payload?.error || `QA_PREVIEW_${response.status}`);
        return payload;
      }

      async function verifySession(config, tokenHash, verificationType) {
        const response = await fetch(`${config.url}/auth/v1/verify`, {
          method: 'POST',
          headers: {
            apikey: config.publishableKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token_hash: tokenHash, type: verificationType || 'magiclink' })
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.access_token || !payload?.refresh_token) {
          throw new Error(payload?.msg || payload?.message || 'VERIFY_FAILED');
        }
        return payload;
      }

      function showTargetSession(session, targetName) {
        sessionStorage.removeItem(QA_HANDOFF_KEY);
        sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
        sessionStorage.setItem(QA_MARKER_KEY, JSON.stringify({ target_name: targetName, started_at: new Date().toISOString() }));
        try { window.opener = null; } catch { /* browser may keep it read-only */ }
        title.textContent = `Staging 실제 계정 검수: ${targetName}`;
        document.title = `${targetName} 실제 계정 검수 · 태장 Staging`;
        state.hidden = true;
        state.style.display = 'none';
        frame.style.display = 'block';
        reload.hidden = false;
        mobileActions.hidden = false;
      }

      async function start() {
        const hash = new URLSearchParams(window.location.hash.slice(1));
        const waiting = hash.get('waiting') === '1';
        const tokenHash = hash.get('token_hash');
        const verificationType = hash.get('type') || 'magiclink';
        const targetName = hash.get('target_name') || '선택 사용자';
        history.replaceState(null, '', window.location.pathname);

        try {
          const config = await loadConfig();
          if (waiting && !tokenHash) {
            stateTitle.textContent = '실제 계정 세션을 준비하고 있습니다.';
            stateCopy.textContent = '선택한 계정의 실제 Auth 세션과 권한을 확인하는 중입니다.';
            const operatorSession = readOperatorSession();
            const selected = readSelectedTarget();
            const created = await createPreviewToken(config, operatorSession, selected.targetProfileId);
            sessionStorage.removeItem(SESSION_KEY);
            const session = await verifySession(config, created.token_hash, created.verification_type || 'magiclink');
            showTargetSession(session, created.target?.display_name || selected.targetName);
            return;
          }
          if (!tokenHash) {
            fail('검수용 일회성 인증정보가 없습니다. 운영총괄 화면의 “실제 계정 검수”에서 다시 열어 주세요.');
            return;
          }
          const session = await verifySession(config, tokenHash, verificationType);
          showTargetSession(session, targetName);
        } catch (error) {
          sessionStorage.removeItem(QA_HANDOFF_KEY);
          console.error(error);
          const code = String(error?.message || 'UNKNOWN').replace(/[^A-Za-z0-9_:-]/g, '').slice(0, 80);
          fail(`실제 계정 검수 세션을 만들 수 없습니다. 운영총괄 화면에서 다시 시도해 주세요. (${code || 'UNKNOWN'})`);
        }
      }

      function closePreview() {
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(QA_MARKER_KEY);
        sessionStorage.removeItem(QA_HANDOFF_KEY);
        window.close();
      }

      reload.addEventListener('click', () => {
        if (frame.contentWindow) frame.contentWindow.location.reload();
      });
      mobileReload.addEventListener('click', () => {
        if (frame.contentWindow) frame.contentWindow.location.reload();
      });
      document.getElementById('qa-close').addEventListener('click', closePreview);
      mobileReturn.addEventListener('click', closePreview);
      window.addEventListener('pagehide', () => {
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(QA_MARKER_KEY);
        sessionStorage.removeItem(QA_HANDOFF_KEY);
      });

      start();
    })();
  </script>
</body>
</html>
